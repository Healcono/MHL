<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سواد سلامت رسانه‌ای | دکتر فاطمه زارعی</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        nude: {
                            50: '#fdfbf7', 100: '#f7f2ea', 200: '#eee4d5', 300: '#e0d1bc',
                            400: '#ccb59a', 500: '#b89a7a', 600: '#a38161', 700: '#89684f',
                            800: '#715543', 900: '#5c4639', 950: '#32251e',
                        },
                        health: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
                            400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
                            800: '#166534', 900: '#14532d', 950: '#052e16',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fdfbf7; color: #32251e; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e0d1bc; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #ccb59a; }
        
        /* Hide Scrollbar for Tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .aparat-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; background: #1a1a1a; margin-bottom: 2rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .aparat-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        /* Typography for Content */
        .prose h3 { color: #14532d; font-weight: 800; font-size: 1.5rem; margin-top: 2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .prose p { line-height: 2; margin-bottom: 1.5rem; text-align: justify; color: #334155; }
        .prose strong { color: #166534; font-weight: 700; }
        .prose ul { list-style-type: disc; padding-right: 1.5rem; margin-bottom: 1.5rem; color: #334155; }
        .prose li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="overflow-hidden">

    <div id="app-root" class="flex h-screen overflow-hidden bg-slate-50 relative">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <script>
        // --- DATA ---
        const sessions = [
            {
                id: 1,
                title: "پارادایم جدید در سلامت عمومی",
                description: "گذار از سواد سنتی به سواد دیجیتال و بررسی پدیده اینفودمیک.",
                content: `
                    <div class="space-y-8 animate-fade-in">
                        <section>
                            <h3 class="text-2xl font-bold text-health-900 mb-4 flex items-center gap-2">
                                ۱. مقدمه: گذار از سواد سنتی به سواد دیجیتال
                            </h3>
                            <p>
                                در دهه‌های گذشته، سواد سلامت تنها به توانایی خواندن نسخه‌ها یا درک دستورالعمل‌های پزشک محدود می‌شد. اما با ظهور عصر دیجیتال و درهم‌تنیدگی رسانه‌ها با زیست‌جهان انسان، مفهوم جدیدی به نام <strong>سواد سلامت رسانه‌ای (Media Health Literacy)</strong> متولد شد.
                            </p>
                            <p>
                                امروزه رسانه‌ها دیگر صرفاً ابزار انتقال پیام نیستند، بلکه سازنده واقعیت‌های سلامت محور هستند. دانشجویان علوم پزشکی و پیراپزشکی باید بدانند که بیمارِ امروز، پیش از ملاقات با پزشک، در «اتاق‌های انتظار مجازی» و «شبکه‌های اجتماعی» با انبوهی از داده‌ها مواجه شده است که لزوماً همگی علمی نیستند.
                            </p>
                        </section>

                        <div class="bg-health-50 border-r-4 border-health-500 p-6 rounded-l-2xl my-6">
                            <strong class="text-health-900 block mb-2 text-lg">سواد سلامت رسانه‌ای (MHL)</strong>
                            <p class="text-health-800 m-0">نقطه‌ی تلاقی سواد سلامت و سواد رسانه‌ای که به معنای مهارتِ واکاوی نقادانه‌ی پیام‌های سلامتی است که از فیلتر رسانه‌های جمعی و اجتماعی عبور کرده‌اند.</p>
                        </div>

                        <section>
                            <h3 class="text-2xl font-bold text-health-900 mb-4">۳. پدیده اینفودمیک (Infodemic) و سلامت عمومی</h3>
                            <p>
                                واژه‌ی <strong>Infodemic</strong> به معنای شیوع بیش از حد اطلاعات (درست یا نادرست) در حین یک اپیدمی است. در اینفودمیک، ما با سه نوع اختلال اطلاعاتی روبرو هستیم:
                            </p>
                            <div class="grid md:grid-cols-3 gap-4 mt-6">
                                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 text-sm">
                                    <strong class="text-blue-900 block mb-1">Mis-information</strong>
                                    اطلاعات نادرستی که بدون نیت بد منتشر می‌شوند.
                                </div>
                                <div class="bg-red-50 p-5 rounded-2xl border border-red-100 text-sm">
                                    <strong class="text-red-900 block mb-1">Dis-information</strong>
                                    اطلاعات غلطی که به عمد برای فریب دادن تولید می‌شوند.
                                </div>
                                <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100 text-sm">
                                    <strong class="text-orange-900 block mb-1">Mal-information</strong>
                                    اطلاعات درستی که برای آسیب زدن منتشر می‌شوند.
                                </div>
                            </div>
                        </section>

                        <section class="bg-slate-900 text-white p-8 rounded-3xl shadow-xl mt-8">
                            <h4 class="text-emerald-400 font-bold mb-4">تامل نقادانه:</h4>
                            <p class="text-slate-300">
                                آخرین باری که یک خبر سلامتی را در اینستاگرام دیدید و بدون تحقیق برای دیگران فرستادید کی بود؟ چه عاملی باعث شد به آن اعتماد کنید؟ رنگ‌بندی صفحه؟ تعداد لایک‌ها؟ یا عنوان دکتر؟
                            </p>
                        </section>
                    </div>
                `,
                imageUrl: "https://images.unsplash.com/photo-1576091160550-2173dad99901?auto=format&fit=crop&q=80&w=1000",
                visualAnalysisPrompt: "آخرین باری که یک خبر سلامتی را در اینستاگرام دیدید و بدون تحقیق برای دیگران فرستادید کی بود؟ چه عاملی باعث شد به آن اعتماد کنید؟",
                factOrMyth: [
                    {
                        id: 1,
                        statement: "تکرار یک خبر در چندین کانال مختلف، نشان‌دهنده صحت آن خبر است.",
                        isFact: false,
                        explanation: "خیر، این پدیده «اثر حقیقت واهی» نام دارد. تکرار یک دروغ آن را تبدیل به حقیقت نمی‌کند."
                    }
                ],
                quiz: [
                    {
                        id: 1,
                        text: "کدام گزینه تعریف صحیحی از «Dis-information» است؟",
                        options: ["اطلاعات نادرست بدون قصد قبلی", "اطلاعات درستی که برای آسیب زدن استفاده می‌شوند", "اطلاعات غلط با هدف فریب و سودجویی", "شیوع بیش از حد اطلاعات"],
                        correctIndex: 2,
                        explanation: "دیس‌اینفورمیشن اطلاعاتی است که عمداً غلط ساخته شده است."
                    }
                ]
            },
            {
                id: 2,
                title: "پشت پرده پیام‌ها؛ چه کسی و چگونه؟",
                description: "هدف درس: درک ساختار پیام‌های رسانه‌ای و آشنایی با تکنیک‌های اقناع.",
                videoUrl: "https://www.aparat.com/video/video/embed/videohash/a2769/vt/frame",
                content: `
                    <div class="space-y-8 animate-fade-in">
                        <section>
                            <h3 class="text-2xl font-bold text-health-900 mb-4 flex items-center gap-2">
                                ۱. اصل اول: رسانه «ساختگی» است
                            </h3>
                            <p>
                                اولین چیزی که باید بدانیم این است که پیام‌های رسانه‌ای (فیلم، خبر، پست اینستاگرام، تبلیغات) مانند یک ساختمان ساخته می‌شوند. قطعاتی انتخاب می‌شوند و قطعاتی کنار گذاشته می‌شوند.
                            </p>
                            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col md:flex-row gap-6 items-center my-6">
                                <div class="flex-1">
                                    <h4 class="font-bold text-health-700 mb-2">مثال واقعی: همبرگر تبلیغاتی</h4>
                                    <p class="text-sm">در واقعیت تبلیغات، از مقوا برای لایه‌بندی، از رنگ روغن برای براق کردن نان و حتی از پنبه نسوز برای تولید دود استفاده می‌شود. آنچه می‌بینیم، واقعیت نیست؛ بلکه <strong>بازنمایی (Representation)</strong> واقعیت است.</p>
                                </div>
                            </div>
                        </section>

                        <section>
                            <h3 class="text-2xl font-bold text-health-900 mb-6">۲. تکنیک‌های اقناع (چطور ما را راضی می‌کنند؟)</h3>
                            <div class="grid md:grid-cols-2 gap-4">
                                <div class="p-6 bg-blue-50 rounded-2xl border border-blue-100">
                                    <strong class="text-blue-900 block mb-2">تکنیک طنز 😂</strong>
                                    <p class="text-sm text-blue-800">وقتی می‌خندیم، گارد دفاعی مغز ما باز می‌شود و پیام را راحت‌تر می‌پذیریم.</p>
                                </div>
                                <div class="p-6 bg-red-50 rounded-2xl border border-red-100">
                                    <strong class="text-red-900 block mb-2">تکنیک ترس ⚠️</strong>
                                    <p class="text-sm text-red-800">«اگر این خمیردندان را نزنی، دندان‌هایت را از دست می‌دهی!» استفاده از ترس برای فروش محصول.</p>
                                </div>
                                <div class="p-6 bg-purple-50 rounded-2xl border border-purple-100">
                                    <strong class="text-purple-900 block mb-2">تکنیک تداعی 🌟</strong>
                                    <p class="text-sm text-purple-800">استفاده از یک سلبریتی محبوب کنار یک نوشابه. مغز ما محبوبیت آن شخص را به آن نوشابه ربط می‌دهد.</p>
                                </div>
                                <div class="p-6 bg-emerald-50 rounded-2xl border border-emerald-100">
                                    <strong class="text-emerald-900 block mb-2">تکنیک گواهی گرفتن 💬</strong>
                                    <p class="text-sm text-emerald-800">استفاده از افرادی شبیه مردم عادی که می‌گویند: «من هم از این استفاده کردم و عالی بود.»</p>
                                </div>
                            </div>
                        </section>

                        <section class="bg-slate-100 p-8 rounded-3xl mt-8">
                            <h3 class="text-xl font-bold text-slate-800 mb-6">۳. بازی‌های کلاسی و فعالیت‌ها</h3>
                            <div class="space-y-6 text-sm">
                                <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-indigo-500">
                                    <strong>بازی اول: «کارگردانِ فریبکار»</strong>
                                    <p class="mt-2 text-slate-600 leading-6">یک وسیله کاملاً بی‌ارزش (مثل یک لنگه جوراب) انتخاب کنید. ماموریت شما نوشتن سناریویی ۳۰ ثانیه‌ای است تا این وسیله را به عنوان یک کالای لوکس به بقیه بفروشید.</p>
                                </div>
                                <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-pink-500">
                                    <strong>بازی دوم: «صداگذاری متفاوت»</strong>
                                    <p class="mt-2 text-slate-600 leading-6">یک ویدیو واحد را با دو موسیقی مختلف (ترسناک و خنده‌دار) تماشا کنید. درک می‌کنید که موسیقی چطور احساسات ما را مدیریت می‌کند.</p>
                                </div>
                            </div>
                        </section>

                        <section class="bg-health-900 text-white p-8 rounded-3xl mt-8">
                            <h3 class="text-xl font-bold mb-4">۵. پرسش‌های کلیدی جلسه</h3>
                            <p class="mb-4 opacity-90">هر وقت پیامی را دیدید، این دو سوال را بپرسید:</p>
                            <ul class="list-disc list-inside space-y-2 text-emerald-300">
                                <li>چه کسی این پیام را با چه هدفی (پول، قدرت، آموزش) ساخته است؟</li>
                                <li>از چه تکنیکی برای جلب توجه من استفاده کرده است؟</li>
                            </ul>
                        </section>
                    </div>
                `,
                imageUrl: "https://images.unsplash.com/photo-1493612276216-ee3925520721?auto=format&fit=crop&q=80&w=1000",
                visualAnalysisPrompt: "چه کسی این پیام را با چه هدفی (پول، قدرت، آموزش) ساخته است؟ از چه تکنیکی برای جلب توجه من استفاده کرده است؟",
                factOrMyth: [
                    {
                        id: 1,
                        statement: "رسانه دقیقاً خودِ واقعیت را به ما نشان می‌دهد.",
                        isFact: false,
                        explanation: "رسانه «بازنمایی» واقعیت است؛ یعنی قطعاتی انتخاب و قطعاتی حذف می‌شوند."
                    }
                ],
                quiz: [
                    {
                        id: 1,
                        text: "کدام تکنیک اقناع از 'سلبریتی‌ها' برای فروش محصول استفاده می‌کند؟",
                        options: ["طنز", "ترس", "تداعی", "گواهی گرفتن"],
                        correctIndex: 2,
                        explanation: "تکنیک تداعی، محبوبیت سلبریتی را به محصول گره می‌زند."
                    }
                ]
            }
        ];

        // Generate placeholder sessions
        for (let i = 3; i <= 17; i++) {
            sessions.push({
                id: i,
                title: `جلسه ${i}`,
                description: "در حال آماده‌سازی محتوا توسط تیم آموزشی...",
                content: "<div class='py-20 text-center text-slate-400'>محتوای این جلسه به زودی بارگذاری خواهد شد.</div>",
                quiz: [],
                factOrMyth: []
            });
        }

        // --- STATE MANAGEMENT ---
        const state = {
            currentSessionId: 1,
            completedSessions: [],
            activeTab: 'content',
            visualRevealed: false,
            isSidebarOpen: false,
            game: {
                currentIndex: 0,
                score: 0,
                finished: false,
                feedback: null, // 'correct' | 'incorrect' | null
                feedbackTimeout: null
            },
            quiz: {
                userAnswers: [],
                submitted: false
            }
        };

        // --- INITIALIZATION ---
        function init() {
            // Load progress
            const saved = localStorage.getItem('completedSessions');
            if (saved) {
                try {
                    state.completedSessions = JSON.parse(saved);
                } catch (e) {
                    console.error("Failed to parse saved progress", e);
                }
            }

            // Init quiz state for first session
            resetQuizState(sessions[0]);
            
            renderApp();
        }

        function resetGameState() {
            if (state.game.feedbackTimeout) clearTimeout(state.game.feedbackTimeout);
            state.game = {
                currentIndex: 0,
                score: 0,
                finished: false,
                feedback: null,
                feedbackTimeout: null
            };
        }

        function resetQuizState(session) {
            state.quiz = {
                userAnswers: new Array(session.quiz.length).fill(-1),
                submitted: false
            };
        }

        // --- ACTIONS ---
        window.app = {
            selectSession: (id) => {
                state.currentSessionId = id;
                state.activeTab = 'content';
                state.visualRevealed = false;
                state.isSidebarOpen = false;
                
                const session = sessions.find(s => s.id === id);
                resetGameState();
                resetQuizState(session);
                
                renderApp();
            },
            
            toggleSidebar: () => {
                state.isSidebarOpen = !state.isSidebarOpen;
                renderApp();
            },

            setTab: (tabId) => {
                state.activeTab = tabId;
                renderApp();
            },

            revealVisual: () => {
                state.visualRevealed = true;
                renderApp();
            },

            // Game Actions
            handleGameGuess: (guessIsFact) => {
                const session = sessions.find(s => s.id === state.currentSessionId);
                const items = session.factOrMyth;
                const currentItem = items[state.game.currentIndex];
                const isCorrect = guessIsFact === currentItem.isFact;

                state.game.feedback = isCorrect ? 'correct' : 'incorrect';
                if (isCorrect) state.game.score++;
                
                renderApp();

                state.game.feedbackTimeout = setTimeout(() => {
                    state.game.feedback = null;
                    if (state.game.currentIndex < items.length - 1) {
                        state.game.currentIndex++;
                    } else {
                        state.game.finished = true;
                    }
                    renderApp();
                }, 2500);
            },

            resetGame: () => {
                resetGameState();
                renderApp();
            },

            // Quiz Actions
            handleQuizSelect: (qIdx, oIdx) => {
                if (state.quiz.submitted) return;
                state.quiz.userAnswers[qIdx] = oIdx;
                renderApp();
            },

            submitQuiz: () => {
                const session = sessions.find(s => s.id === state.currentSessionId);
                if (state.quiz.userAnswers.includes(-1)) {
                    alert("لطفاً به تمام سوالات پاسخ دهید.");
                    return;
                }
                
                state.quiz.submitted = true;
                
                // Calculate score
                const score = state.quiz.userAnswers.reduce((acc, ans, idx) => {
                    return acc + (ans === session.quiz[idx].correctIndex ? 1 : 0);
                }, 0);

                // Mark complete if score > 50%
                if (score >= Math.ceil(session.quiz.length / 2)) {
                    if (!state.completedSessions.includes(session.id)) {
                        state.completedSessions.push(session.id);
                        localStorage.setItem('completedSessions', JSON.stringify(state.completedSessions));
                    }
                }
                renderApp();
            },

            resetQuiz: () => {
                const session = sessions.find(s => s.id === state.currentSessionId);
                resetQuizState(session);
                renderApp();
            }
        };

        // --- RENDER FUNCTIONS ---
        function renderApp() {
            const root = document.getElementById('app-root');
            const currentSession = sessions.find(s => s.id === state.currentSessionId) || sessions[0];
            
            root.innerHTML = `
                ${renderMobileHeader()}
                ${renderSidebarOverlay()}
                ${renderSidebar()}
                ${renderMainContent(currentSession)}
            `;
            
            // Initialize Icons
            lucide.createIcons();
        }

        function renderMobileHeader() {
            return `
                <div class="lg:hidden fixed top-0 left-0 right-0 h-16 bg-white border-b z-30 flex items-center justify-between px-4 shadow-sm">
                    <div class="flex items-center gap-2">
                        <button onclick="app.toggleSidebar()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                            <i data-lucide="menu" class="w-6 h-6"></i>
                        </button>
                        <span class="font-bold text-health-900 flex items-center gap-2">
                            <i data-lucide="graduation-cap" class="text-health-600 w-5 h-5"></i>
                            سواد سلامت رسانه‌ای
                        </span>
                    </div>
                </div>
            `;
        }

        function renderSidebarOverlay() {
            if (!state.isSidebarOpen) return '';
            return `<div class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm" onclick="app.toggleSidebar()"></div>`;
        }

        function renderSidebar() {
            const sidebarClasses = `
                fixed lg:sticky top-0 right-0 h-screen w-80 bg-white border-l shadow-lg z-50 transform transition-transform duration-300 ease-in-out flex flex-col
                ${state.isSidebarOpen ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'}
            `;

            let listHtml = sessions.map((session, index) => {
                const isCompleted = state.completedSessions.includes(session.id);
                const isActive = state.currentSessionId === session.id;
                
                let iconHtml = '';
                if (isCompleted) {
                    iconHtml = `<i data-lucide="check-circle" class="w-[18px] h-[18px] text-health-500"></i>`;
                } else if (isActive) {
                    iconHtml = `<i data-lucide="play-circle" class="w-[18px] h-[18px] text-health-600 animate-pulse"></i>`;
                } else {
                    iconHtml = `<i data-lucide="circle" class="w-[18px] h-[18px] text-slate-300"></i>`;
                }

                return `
                    <button
                        onclick="app.selectSession(${session.id})"
                        class="w-full text-right px-4 py-3 border-l-4 transition-all hover:bg-slate-50 flex items-start gap-3
                        ${isActive ? 'border-health-600 bg-health-50/50' : 'border-transparent text-slate-600'}"
                    >
                        <div class="mt-1 flex-shrink-0">${iconHtml}</div>
                        <div>
                            <div class="text-xs font-semibold text-slate-400 mb-1">جلسه ${index + 1}</div>
                            <div class="text-sm font-medium leading-tight ${isActive ? 'text-health-900' : 'text-slate-700'}">
                                ${session.title}
                            </div>
                        </div>
                    </button>
                `;
            }).join('');

            return `
                <div class="${sidebarClasses}">
                    <div class="flex items-center justify-between p-4 border-b h-16 flex-shrink-0">
                        <h1 class="font-bold text-health-900 text-lg flex items-center gap-2">
                            <i data-lucide="graduation-cap" class="text-health-600 w-5 h-5"></i>
                            سواد سلامت رسانه‌ای
                        </h1>
                        <button onclick="app.toggleSidebar()" class="lg:hidden p-1 text-slate-500">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto custom-scrollbar py-2">
                        ${listHtml}
                    </div>

                    <div class="p-4 border-t bg-slate-50 flex-shrink-0">
                        <div class="bg-slate-100 rounded-lg p-4 text-xs text-slate-500">
                            <p class="font-bold text-slate-700 mb-2">ارتباط با مدرس</p>
                            <p class="flex items-center gap-2 mb-1"><i data-lucide="mail" class="w-3 h-3"></i> healcono@gmail.com</p>
                            <p class="flex items-center gap-2"><i data-lucide="instagram" class="w-3 h-3"></i> @healthcono</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMainContent(session) {
            const progress = Math.round((state.completedSessions.length / sessions.length) * 100);
            
            return `
                <main class="flex-1 w-full lg:w-auto pt-16 lg:pt-0 overflow-y-auto h-screen scroll-smooth custom-scrollbar">
                    <div class="max-w-4xl mx-auto p-4 md:p-8 pb-32">
                        <!-- Header Stats -->
                        <div class="mb-6 flex items-center justify-between">
                            <div>
                                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-1">دوره آموزشی دانشگاهی</h2>
                                <div class="text-xs text-slate-400">Dr. Fatemeh Zarei</div>
                            </div>
                            <div class="flex flex-col items-end">
                                <span class="text-sm font-medium text-health-700 mb-1">
                                    پیشرفت دوره: ${progress}%
                                </span>
                                <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                                    <div 
                                        class="h-full bg-health-500 transition-all duration-500 ease-out"
                                        style="width: ${progress}%"
                                    ></div>
                                </div>
                            </div>
                        </div>

                        <!-- Session Card -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden animate-fade-in">
                            ${renderSessionHeader(session)}
                            ${renderTabs()}
                            <div class="p-6 md:p-8 min-h-[400px]">
                                ${renderTabContent(session)}
                            </div>
                            ${session.id === 17 && state.activeTab === 'content' ? renderContact() : ''}
                        </div>
                    </div>
                </main>
            `;
        }

        function renderSessionHeader(session) {
            return `
                <div class="h-48 md:h-64 w-full bg-slate-200 relative overflow-hidden">
                    ${session.imageUrl ? `<img src="${session.imageUrl}" alt="${session.title}" class="w-full h-full object-cover" />` : ''}
                    <div class="absolute inset-0 bg-gradient-to-t from-health-950/90 to-transparent flex items-end p-6 md:p-8">
                        <div class="animate-fade-in-up">
                            <span class="inline-block px-3 py-1 bg-health-500/20 backdrop-blur-md border border-health-400/30 text-white text-xs rounded-full mb-2 font-medium">جلسه ${session.id}</span>
                            <h1 class="text-2xl md:text-3xl font-bold text-white shadow-sm">${session.title}</h1>
                            <p class="text-health-50 mt-2 text-sm md:text-base max-w-2xl">${session.description}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTabs() {
            const tabs = [
                { id: 'content', icon: 'book-open', label: 'درسنامه' },
                { id: 'visual', icon: 'eye', label: 'تحلیل تصویری' },
                { id: 'video', icon: 'monitor-play', label: 'ویدیو آموزشی' },
                { id: 'interactive', icon: 'brain-circuit', label: 'بازی و تعامل' },
                { id: 'quiz', icon: 'check-square', label: 'آزمون' },
            ];

            const buttonsHtml = tabs.map(tab => {
                const isActive = state.activeTab === tab.id;
                const activeClass = isActive 
                    ? 'border-health-600 text-health-800 bg-health-50/50' 
                    : 'border-transparent text-slate-500 hover:text-health-600 hover:bg-slate-50';
                const iconClass = isActive ? "text-health-600" : "";

                return `
                    <button
                        onclick="app.setTab('${tab.id}')"
                        class="flex-1 min-w-[100px] py-4 px-4 text-sm font-medium flex flex-col items-center gap-2 border-b-2 transition-all duration-300 ${activeClass}"
                    >
                        <i data-lucide="${tab.icon}" class="w-5 h-5 ${iconClass}"></i>
                        <span class="whitespace-nowrap">${tab.label}</span>
                    </button>
                `;
            }).join('');

            return `<div class="flex border-b overflow-x-auto no-scrollbar">${buttonsHtml}</div>`;
        }

        function renderTabContent(session) {
            switch (state.activeTab) {
                case 'content': return renderContentTab(session);
                case 'visual': return renderVisualTab(session);
                case 'video': return renderVideoTab(session);
                case 'interactive': return renderInteractiveTab(session);
                case 'quiz': return renderQuizTab(session);
                default: return '';
            }
        }

        function renderContentTab(session) {
            return `
                <div class="prose prose-lg prose-slate max-w-none text-justify animate-fade-in">
                    ${session.content}
                    <div class="mt-8 flex justify-end">
                        <button 
                            onclick="app.setTab('visual')"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md"
                        >
                            مرحله بعد: تحلیل تصویری
                        </button>
                    </div>
                </div>
            `;
        }

        function renderVisualTab(session) {
            return `
                <div class="flex flex-col items-center justify-center space-y-6 animate-fade-in">
                    <div class="bg-slate-100 p-2 rounded-xl w-full max-w-2xl shadow-inner relative group">
                        <img 
                            src="${session.imageUrl || "https://picsum.photos/800/600"}" 
                            alt="Visual Analysis" 
                            class="w-full rounded-lg transition-all duration-1000 ease-in-out ${state.visualRevealed ? 'filter-none' : 'blur-md grayscale'}"
                        />
                        ${!state.visualRevealed ? `
                            <div class="absolute inset-0 flex items-center justify-center z-10">
                                <button 
                                    onclick="app.revealVisual()"
                                    class="px-6 py-3 bg-health-600 text-white rounded-full shadow-lg hover:bg-health-700 transform hover:scale-105 transition-all flex items-center gap-2"
                                >
                                    <i data-lucide="eye" class="w-5 h-5"></i>
                                    <span>کلیک برای تحلیل</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    
                    ${state.visualRevealed ? `
                        <div class="max-w-2xl bg-health-50 p-6 rounded-xl border border-health-100 animate-fade-in-up w-full">
                            <h4 class="font-bold text-health-900 mb-2 flex items-center gap-2">
                                <i data-lucide="brain-circuit" class="w-5 h-5 text-health-600"></i>
                                پرسش تحلیلی:
                            </h4>
                            <p class="text-health-800 leading-7">
                                ${session.visualAnalysisPrompt || "به عناصر موجود در تصویر دقت کنید. چه پیامی به صورت پنهان منتقل می‌شود؟"}
                            </p>
                            <div class="mt-4">
                                <textarea 
                                    class="w-full p-3 border border-health-200 rounded-lg text-sm focus:ring-2 focus:ring-health-500 outline-none bg-white" 
                                    placeholder="تحلیل خود را اینجا بنویسید..."
                                    rows="3"
                                ></textarea>
                            </div>
                        </div>
                    ` : ''}
                    <div class="w-full flex justify-end mt-4">
                        <button 
                            onclick="app.setTab('video')"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md"
                        >
                            مرحله بعد: ویدیو
                        </button>
                    </div>
                </div>
            `;
        }

        function renderVideoTab(session) {
            return `
                <div class="flex flex-col items-center animate-fade-in">
                    <div class="w-full max-w-3xl bg-slate-900 rounded-xl overflow-hidden shadow-lg mb-6">
                        ${session.videoUrl ? `
                            <div class="aparat-container">
                                <iframe 
                                    src="${session.videoUrl}" 
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                    title="${session.title}"
                                    webkitallowfullscreen="true"
                                    mozallowfullscreen="true"
                                ></iframe>
                            </div>
                        ` : `
                            <div class="flex items-center justify-center aspect-video text-slate-400 flex-col gap-3 p-12">
                                <i data-lucide="monitor-play" class="w-12 h-12"></i>
                                <p>ویدیو برای این جلسه بارگذاری نشده است.</p>
                            </div>
                        `}
                    </div>
                    <p class="text-slate-600 text-center max-w-2xl mb-8">
                        ویدیو را با دقت تماشا کنید. نکات کلیدی در آزمون پایانی مورد پرسش قرار می‌گیرند.
                    </p>
                    <div class="w-full flex justify-end">
                        <button 
                            onclick="app.setTab('interactive')"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md"
                        >
                            مرحله بعد: بازی
                        </button>
                    </div>
                </div>
            `;
        }

        function renderInteractiveTab(session) {
            if (!session.factOrMyth || session.factOrMyth.length === 0) {
                return `
                    <div class="animate-fade-in">
                        <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-12 text-center text-slate-400">
                            <i data-lucide="brain-circuit" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                            <p>بازی تعاملی برای این جلسه در دسترس نیست.</p>
                        </div>
                        <div class="w-full flex justify-end mt-8">
                            <button onclick="app.setTab('quiz')" class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md">
                                مرحله بعد: آزمون
                            </button>
                        </div>
                    </div>
                `;
            }

            const { currentIndex, score, finished, feedback } = state.game;
            const items = session.factOrMyth;

            if (finished) {
                return `
                    <div class="bg-gradient-to-br from-health-50 to-emerald-50 p-8 rounded-xl text-center border border-health-100 animate-fade-in">
                        <h3 class="text-2xl font-bold text-health-900 mb-4">پایان بازی!</h3>
                        <p class="text-lg text-health-700 mb-6">
                            امتیاز شما: <span class="font-bold text-2xl">${score}</span> از ${items.length}
                        </p>
                        <button 
                            onclick="app.resetGame()"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition shadow-lg shadow-health-200"
                        >
                            شروع مجدد
                        </button>
                        <div class="w-full flex justify-center mt-8">
                            <button onclick="app.setTab('quiz')" class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md">
                                مرحله بعد: آزمون
                            </button>
                        </div>
                    </div>
                `;
            }

            const currentItem = items[currentIndex];
            const progress = ((currentIndex) / items.length) * 100;

            return `
                <div class="max-w-2xl mx-auto animate-fade-in">
                    <div class="mb-6 text-center">
                        <h3 class="text-xl font-bold text-health-800 mb-2">چالش واقعیت یا شایعه</h3>
                        <p class="text-slate-600">کارتهای زیر را بر اساس واقعیت یا شایعه بودن دسته‌بندی کنید.</p>
                    </div>

                    <div class="relative bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden min-h-[300px] flex flex-col">
                        <!-- Progress Bar -->
                        <div class="h-2 bg-slate-100 w-full">
                            <div class="h-full bg-health-500 transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <div class="flex-1 p-8 flex flex-col items-center justify-center text-center animate-fade-in">
                            <div class="mb-6">
                                <span class="bg-health-100 text-health-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                    سوال ${currentIndex + 1} از ${items.length}
                                </span>
                            </div>
                            
                            <h4 class="text-xl md:text-2xl font-bold text-slate-800 leading-normal mb-8">
                                ${currentItem.statement}
                            </h4>

                            ${feedback === null ? `
                                <div class="flex gap-4 w-full max-w-md justify-center">
                                    <button
                                        onclick="app.handleGameGuess(true)"
                                        class="flex-1 py-4 px-6 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 rounded-xl hover:bg-emerald-100 hover:border-emerald-300 transition flex flex-col items-center gap-2"
                                    >
                                        <i data-lucide="thumbs-up" class="w-6 h-6"></i>
                                        <span class="font-bold">واقعیت است</span>
                                    </button>
                                    <button
                                        onclick="app.handleGameGuess(false)"
                                        class="flex-1 py-4 px-6 bg-rose-50 border-2 border-rose-200 text-rose-700 rounded-xl hover:bg-rose-100 hover:border-rose-300 transition flex flex-col items-center gap-2"
                                    >
                                        <i data-lucide="thumbs-down" class="w-6 h-6"></i>
                                        <span class="font-bold">شایعه است</span>
                                    </button>
                                </div>
                            ` : `
                                <div class="w-full p-4 rounded-xl border ${feedback === 'correct' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} animate-fade-in-up">
                                    <div class="flex items-center justify-center gap-2 mb-2 font-bold text-lg">
                                        ${feedback === 'correct' ? `
                                            <span class="text-green-600 flex items-center gap-2"><i data-lucide="check"></i> صحیح!</span>
                                        ` : `
                                            <span class="text-red-600 flex items-center gap-2"><i data-lucide="x"></i> اشتباه!</span>
                                        `}
                                    </div>
                                    <p class="text-slate-700 text-sm">${currentItem.explanation}</p>
                                    <div class="mt-4 text-xs text-slate-400">سوال بعدی در حال بارگذاری...</div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuizTab(session) {
            const questions = session.quiz;
            const { userAnswers, submitted } = state.quiz;
            const isCompleted = state.completedSessions.includes(session.id);

            if (!questions || questions.length === 0) {
                return `
                    <div class="text-center p-8 text-slate-500 bg-slate-50 rounded-lg animate-fade-in">
                        آزمونی برای این جلسه تعریف نشده است.
                    </div>
                `;
            }

            const questionsHtml = questions.map((q, qIdx) => {
                const optionsHtml = q.options.map((opt, oIdx) => {
                    let btnClass = "w-full text-right p-4 rounded-lg border-2 transition-all flex items-center justify-between ";
                    let iconHtml = '';

                    if (submitted) {
                        if (oIdx === q.correctIndex) {
                            btnClass += "bg-green-100 border-green-500 text-green-900";
                            iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600"></i>`;
                        } else if (userAnswers[qIdx] === oIdx && oIdx !== q.correctIndex) {
                            btnClass += "bg-red-50 border-red-300 text-red-900";
                            iconHtml = `<i data-lucide="alert-circle" class="w-5 h-5 text-red-600"></i>`;
                        } else {
                            btnClass += "bg-slate-50 border-transparent text-slate-400 opacity-50";
                        }
                    } else {
                        if (userAnswers[qIdx] === oIdx) {
                            btnClass += "bg-health-50 border-health-500 text-health-900";
                        } else {
                            btnClass += "bg-white border-slate-200 hover:bg-slate-50 text-slate-700";
                        }
                    }

                    return `
                        <button
                            onclick="app.handleQuizSelect(${qIdx}, ${oIdx})"
                            class="${btnClass}"
                            ${submitted ? 'disabled' : ''}
                        >
                            <span>${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white border rounded-xl p-6 shadow-sm">
                        <h4 class="font-bold text-lg mb-4 flex gap-2">
                            <span class="text-health-500">${qIdx + 1}.</span> ${q.text}
                        </h4>
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>
                        ${submitted ? `
                            <div class="mt-4 p-4 bg-blue-50 text-blue-800 rounded-lg text-sm leading-6">
                                <strong>توضیح:</strong> ${q.explanation}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-8 max-w-3xl mx-auto animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-bold text-health-900">آزمون ارزشیابی</h3>
                        ${!submitted ? `
                            <span class="text-sm text-slate-500">${userAnswers.filter(a => a !== -1).length} از ${questions.length} پاسخ داده شده</span>
                        ` : ''}
                    </div>

                    ${questionsHtml}

                    <div class="flex justify-end pt-4">
                        ${!submitted ? `
                            <button 
                                onclick="app.submitQuiz()"
                                class="px-8 py-3 bg-health-700 text-white font-bold rounded-lg shadow hover:bg-health-800 transition-colors flex items-center gap-2"
                            >
                                ثبت پاسخ‌ها
                            </button>
                        ` : `
                            <button 
                                onclick="app.resetQuiz()"
                                class="px-8 py-3 bg-slate-600 text-white font-bold rounded-lg shadow hover:bg-slate-700 transition-colors flex items-center gap-2"
                            >
                                <i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i>
                                آزمون مجدد
                            </button>
                        `}
                    </div>

                    ${isCompleted ? `
                        <div class="mt-8 bg-green-50 border border-green-200 rounded-xl p-6 text-center animate-fade-in-up">
                            <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 rounded-full text-green-600 mb-3">
                                <i data-lucide="check-square" class="w-6 h-6"></i>
                            </div>
                            <h4 class="text-green-800 font-bold text-lg mb-1">جلسه تکمیل شد!</h4>
                            <p class="text-green-700 text-sm">شما این جلسه را با موفقیت گذراندید.</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderContact() {
            return `
                <div class="bg-slate-900 text-white p-12 text-center mt-12">
                    <h2 class="text-3xl font-bold mb-4">ارتباط با ما</h2>
                    <p class="text-slate-400 mb-8">برای همکاری‌های علمی و پژوهشی</p>
                    <div class="flex justify-center gap-6">
                        <a href="mailto:healcono@gmail.com" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300">
                            <i data-lucide="mail"></i> healcono@gmail.com
                        </a>
                        <a href="#" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300">
                            <i data-lucide="instagram"></i> @healthcono
                        </a>
                    </div>
                </div>
            `;
        }

        // Start App
        init();

    </script>
</body>
</html>
