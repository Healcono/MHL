<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سواد رسانه‌ای در سلامت | Dr. Fatemeh Zarei</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        health: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
                            400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
                            800: '#166534', 900: '#14532d', 950: '#052e16',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .aparat-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; background: #000; }
        .aparat-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .prose h3 { color: #14532d; font-weight: 800; font-size: 1.5rem; margin: 2rem 0 1rem; border-right: 4px solid #22c55e; padding-right: 1rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 2; text-align: justify; color: #334155; }
        .active-session { background-color: #f0fdf4; border-right: 4px solid #16a34a; }
        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
</head>
<body class="overflow-hidden">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-72 bg-white border-l shadow-xl transform translate-x-full transition-transform duration-300 lg:relative lg:translate-x-0 flex flex-col">
            <div class="p-4 border-b h-16 flex items-center justify-between bg-white sticky top-0">
                <h1 class="font-bold text-health-900 flex items-center gap-2">
                    <i data-lucide="graduation-cap" class="text-health-600"></i>
                    سواد سلامت رسانه‌ای
                </h1>
                <button onclick="toggleSidebar()" class="lg:hidden p-1 text-slate-500"><i data-lucide="x"></i></button>
            </div>
            <div id="session-list" class="flex-1 overflow-y-auto custom-scrollbar py-2">
                <!-- Sidebar items injected here -->
            </div>
            <div class="p-4 border-t bg-slate-50">
                <div class="text-xs text-slate-500">
                    <p class="font-bold text-slate-700 mb-1">ارتباط با مدرس</p>
                    <p>Dr. Fatemeh Zarei</p>
                    <p>healcono@gmail.com</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto">
            <!-- Mobile Header -->
            <header class="lg:hidden h-16 bg-white border-b px-4 flex items-center justify-between sticky top-0 z-40">
                <button onclick="toggleSidebar()" class="p-2 text-slate-600"><i data-lucide="menu"></i></button>
                <span class="font-bold text-health-900">سواد سلامت</span>
                <div class="w-8"></div>
            </header>

            <div class="max-w-4xl mx-auto w-full p-4 md:p-8 pb-32">
                <!-- Progress Stats -->
                <div class="mb-6 flex items-center justify-between">
                    <div>
                        <h2 class="text-sm font-semibold text-slate-500 uppercase">دوره آموزشی دانشگاهی</h2>
                        <div class="text-xs text-slate-400">مدرس: دکتر فاطمه زارعی</div>
                    </div>
                    <div class="text-left">
                        <div id="progress-text" class="text-sm font-medium text-health-700 mb-1">پیشرفت: ۰٪</div>
                        <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-health-500 transition-all duration-500 w-0"></div>
                        </div>
                    </div>
                </div>

                <!-- Session View Container -->
                <div id="session-view" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden min-h-[500px]">
                    <!-- Content injected here via main.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

    <!-- Vanilla JS Logic as a Module -->
    <script type="module" src="main.js"></script>
</body>
</html>
