        function renderApp() {
            const root = document.getElementById('app-root');
            const currentSession = sessions.find(s => s.id === state.currentSessionId) || sessions[0];
            
            // Check if search input was previously focused
            const activeEl = document.activeElement;
            const wasSearchFocused = activeEl && activeEl.id === 'sidebar-search-input';
            const selectionStart = wasSearchFocused ? activeEl.selectionStart : null;
            const selectionEnd = wasSearchFocused ? activeEl.selectionEnd : null;

            root.innerHTML = `
                ${renderMobileHeader()}
                ${renderSidebarOverlay()}
                ${renderSidebar()}
                ${renderMainContent(currentSession)}
            `;
            
            // Initialize Icons
            lucide.createIcons();

            // Setup scroll listeners for progress bar and scroll-to-top
            if (typeof setupScrollEvents === 'function') {
                setupScrollEvents();
            }

            // Restore search input focus and cursor if typing
            if (wasSearchFocused) {
                const searchInput = document.getElementById('sidebar-search-input');
                if (searchInput) {
                    searchInput.focus();

        // Synchronize scroll position with reading progress bar and scroll-to-top button
        function setupScrollEvents() {
            const mainContent = document.getElementById('main-content');
            const btn = document.getElementById('scroll-to-top');
            const progressBar = document.getElementById('reading-progress-bar');
            
            if (!mainContent) return;

            mainContent.onscroll = () => {
                const scrollTop = mainContent.scrollTop;
                const scrollHeight = mainContent.scrollHeight - mainContent.clientHeight;
                
                // Update reading progress bar
                if (progressBar && scrollHeight > 0) {
                    const pct = Math.min(100, Math.max(0, Math.round((scrollTop / scrollHeight) * 100)));
                    progressBar.style.width = pct + '%';
                }

                // Toggle scroll-to-top button
                if (btn) {
                    if (scrollTop > 260) {
                        btn.classList.remove('opacity-0', 'invisible', 'translate-y-10');
                    } else {
                        btn.classList.add('opacity-0', 'invisible', 'translate-y-10');
                    }
                }
            };
        }

        window.addEventListener('resize', setupScrollEvents);
        setTimeout(setupScrollEvents, 100);

                                </div>
                            ` : `
                                <div class="w-full p-4 rounded-xl border ${feedback === 'correct' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} animate-fade-in-up">
                                    <div class="flex items-center justify-center gap-2 mb-2 font-bold text-lg">
                                        ${feedback === 'correct' ? `
                                            <span class="text-green-600 flex items-center gap-2"><i data-lucide="check"></i> صحیح!</span>
                                        ` : `
                                            <span class="text-red-600 flex items-center gap-2"><i data-lucide="x"></i> اشتباه!</span>
                                        `}
                                    </div>
                                    <p class="text-slate-700 text-sm">${currentItem.explanation}</p>
                                    <div class="mt-4 text-xs text-slate-400">سوال بعدی در حال بارگذاری...</div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuizTab(session) {
            const questions = session.quiz;
            const { userAnswers, submitted } = state.quiz;
            const isCompleted = state.completedSessions.includes(session.id);

            if (!questions || questions.length === 0) {
                return `
                    <div class="text-center p-8 text-slate-500 bg-slate-50 rounded-lg animate-fade-in">
                        آزمونی برای این جلسه تعریف نشده است.
                    </div>
                `;
            }

            const questionsHtml = questions.map((q, qIdx) => {
                const optionsHtml = q.options.map((opt, oIdx) => {
                    let btnClass = "w-full text-right p-4 rounded-lg border-2 transition-all flex items-center justify-between ";
                    let iconHtml = '';

                    if (submitted) {
                        if (oIdx === q.correctIndex) {
                            btnClass += "bg-green-100 border-green-500 text-green-900";
                            iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600"></i>`;
                        } else if (userAnswers[qIdx] === oIdx && oIdx !== q.correctIndex) {
                            btnClass += "bg-red-50 border-red-300 text-red-900";
                            iconHtml = `<i data-lucide="alert-circle" class="w-5 h-5 text-red-600"></i>`;
                        } else {
                            btnClass += "bg-slate-50 border-transparent text-slate-400 opacity-50";
                        }
                    } else {
                        if (userAnswers[qIdx] === oIdx) {
                            btnClass += "bg-health-50 border-health-500 text-health-900";
                        } else {
                            btnClass += "bg-white border-slate-200 hover:bg-slate-50 text-slate-700";
                        }
                    }

                    return `
                        <button
                            onclick="app.handleQuizSelect(${qIdx}, ${oIdx})"
                            class="${btnClass}"
                            ${submitted ? 'disabled' : ''}
                        >
                            <span>${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white border rounded-xl p-6 shadow-sm">
                        <h4 class="font-bold text-lg mb-4 flex gap-2">
                            <span class="text-health-500">${qIdx + 1}.</span> ${q.text}
                        </h4>
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>
                        ${submitted ? `
                            <div class="mt-4 p-4 bg-blue-50 text-blue-800 rounded-lg text-sm leading-6">
                                <strong>توضیح:</strong> ${q.explanation}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-8 max-w-3xl mx-auto animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-bold text-health-900">آزمون ارزشیابی</h3>
                        ${!submitted ? `
                            <span class="text-sm text-slate-500">${userAnswers.filter(a => a !== -1).length} از ${questions.length} پاسخ داده شده</span>
                        ` : ''}
                    </div>

                    ${questionsHtml}

                    <div class="flex justify-end pt-4">
                        ${!submitted ? `
                            <button 
                                onclick="app.submitQuiz()"
                                class="px-8 py-3 bg-health-700 text-white font-bold rounded-lg shadow hover:bg-health-800 transition-colors flex items-center gap-2"
                            >
                                ثبت پاسخ‌ها
                            </button>
                        ` : `
                            <button 
                                onclick="app.resetQuiz()"
                                class="px-8 py-3 bg-slate-600 text-white font-bold rounded-lg shadow hover:bg-slate-700 transition-colors flex items-center gap-2"
                            >
                                <i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i>
                                آزمون مجدد
                            </button>
                        `}
                    </div>

                    ${isCompleted ? `
                        <div class="mt-8 bg-green-50 border border-green-200 rounded-xl p-6 text-center animate-fade-in-up">
                            <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 rounded-full text-green-600 mb-3">
                                <i data-lucide="check-square" class="w-6 h-6"></i>
                            </div>
                            <h4 class="text-green-800 font-bold text-lg mb-1">جلسه تکمیل شد!</h4>
                            <p class="text-green-700 text-sm">شما این جلسه را با موفقیت گذراندید.</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderSessionSummaryCard(session) {
            // Extract key takeaways from content (simplified for this example)
            // In a real app, this might be a separate field in the session object
            const summaryMatch = session.content.match(/<strong class="text-health-900 block mb-2 text-lg">خلاصه (جلسه|مدیریتی)<\/strong>\s*<p.*?>(.*?)<\/p>/s);
            const summaryText = summaryMatch ? summaryMatch[1] : session.description;

            return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300 flex flex-col h-full">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-health-50 flex items-center justify-center text-health-600 font-bold text-sm">
                            ${session.id}
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg line-clamp-1" title="${session.title}">${session.title}</h3>
                    </div>
                    <p class="text-slate-600 text-sm leading-relaxed flex-grow mb-4 line-clamp-4">
                        ${summaryText.replace(/<[^>]*>/g, '')}
                    </p>
                    <button 
                        onclick="app.selectSession(${session.id})"
                        class="text-health-600 text-sm font-medium hover:text-health-700 flex items-center gap-1 mt-auto self-end"
                    >
                        مشاهده کامل
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
        }

                <footer class="mt-12 rounded-3xl bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 text-white p-8 md:p-10 shadow-xl border border-emerald-800/40 relative overflow-hidden animate-fade-in">

                    </div>

                    <div class="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

                                <a href="https://uploadkon.ir/uploads/fd5002_26Tarbiat-Modares-University-Logo-450x450.png" target="_blank" rel="noopener noreferrer" title="مشاهده آرم دانشگاه تربیت مدرس" class="group block p-2 rounded-2xl bg-white/10 backdrop-blur-md border border-white/15 hover:border-emerald-400/60 hover:bg-white/15 transition-all shadow-md flex-shrink-0">
                                    <img src="https://uploadkon.ir/uploads/fd5002_26Tarbiat-Modares-University-Logo-450x450.png" alt="آرم رسمی دانشگاه تربیت مدرس" class="h-14 w-14 object-contain transition-transform duration-300 group-hover:scale-105" loading="lazy" referrerpolicy="no-referrer" />
                                </a>
                                <div>
                                    <h4 class="text-lg font-extrabold text-white tracking-tight flex items-center gap-2">
                                        <span>سواد سلامت رسانه‌ای</span>
                                        <span class="text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-400/30">MHL</span>
                                    </h4>
                                    <p class="text-xs text-emerald-200/90 font-medium mt-0.5">دانشگاه تربیت مدرس • دانشکده علوم پزشکی</p>
                                </div>
                            </div>
                            <p class="text-xs text-slate-300/90 leading-relaxed max-w-md">
                                سامانه تعاملی و پیشرفت تحصیلی سواد سلامت رسانه‌ای؛ گامی در جهت توانمندسازی دانشجویان و جامعه در تحلیل نقادانه پیام‌ها، مهار اینفودمیک و تدوین رژیم مصرف دیجیتال.

                        <!-- Column 2: Teacher Profile & Info (4 cols) -->
                        <div class="lg:col-span-4 bg-white/5 backdrop-blur-md p-5 rounded-2xl border border-white/10 space-y-3">
                            <div class="flex items-center gap-2.5 text-emerald-300 text-xs font-bold">
                                <i data-lucide="award" class="w-4 h-4 text-emerald-400"></i>
                                <span>مدرس دوره و صاحب اثر:</span>
                            </div>
                            <div>
                                <h5 class="text-base font-extrabold text-white">دکتر فاطمه زارعی</h5>
                                <p class="text-xs text-emerald-100/80 mt-0.5">دانشیار دانشگاه تربیت مدرس</p>
                                <p class="text-[11px] text-slate-300 mt-1">گروه آموزش بهداشت و ارتقای سلامت، دانشکده علوم پزشکی</p>
                            </div>
                        </div>

                        <!-- Column 3: Direct Contact Links & Social (3 cols) -->
                        <div class="lg:col-span-3 space-y-2.5">
                            <div class="text-xs font-bold text-emerald-300 mb-2 flex items-center gap-1.5">
                                <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                <span>پل‌های ارتباطی مستقیم:</span>
                            </div>
                            <a href="mailto:f.zarei@modares.ac.ir" class="flex items-center gap-2.5 text-xs text-slate-200 hover:text-white bg-white/10 hover:bg-emerald-600/40 p-2.5 rounded-xl border border-white/10 transition-all group" dir="ltr">
                                <div class="w-6 h-6 rounded-lg bg-emerald-500/20 group-hover:bg-emerald-500/40 flex items-center justify-center text-emerald-300 flex-shrink-0 transition-colors">
                                    <i data-lucide="mail" class="w-3.5 h-3.5"></i>
                                </div>
                                <span class="font-mono text-[11px] truncate">f.zarei@modares.ac.ir</span>
                            </a>
                            <a href="mailto:healcono@gmail.com" class="flex items-center gap-2.5 text-xs text-slate-200 hover:text-white bg-white/10 hover:bg-emerald-600/40 p-2.5 rounded-xl border border-white/10 transition-all group" dir="ltr">
                                <div class="w-6 h-6 rounded-lg bg-emerald-500/20 group-hover:bg-emerald-500/40 flex items-center justify-center text-emerald-300 flex-shrink-0 transition-colors">
                                    <i data-lucide="at-sign" class="w-3.5 h-3.5"></i>
                                </div>
                                <span class="font-mono text-[11px] truncate">healcono@gmail.com</span>
                            </a>

                                <div class="w-6 h-6 rounded-lg bg-emerald-500/20 group-hover:bg-emerald-500/40 flex items-center justify-center text-emerald-300 flex-shrink-0 transition-colors">

                            <span>ارائه‌شده توسط دکتر فاطمه زارعی • تمام حقوق علمی و محتوایی محفوظ است.</span>

                        <button 
                            onclick="document.getElementById('main-content').scrollTo({top: 0, behavior: 'smooth'})"

                            <span>بازگشت به ابتدای صفحه</span>
                            <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </footer>
            `;
        }

        function renderContact() {
            return `
                <div class="mt-8">
                    <!-- Session 10 Specific Completion Banner -->
                    <div class="bg-gradient-to-r from-emerald-800 to-teal-900 text-white p-8 text-center rounded-2xl shadow-lg border border-emerald-700/50 relative overflow-hidden">
                        <div class="relative z-10 max-w-xl mx-auto">
                            <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-white/20">
                                <i data-lucide="graduation-cap" class="w-7 h-7 text-emerald-300"></i>
                            </div>
                            <h3 class="text-2xl font-black mb-2">تبریک! دوره سواد سلامت رسانه‌ای تکمیل شد</h3>
                            <p class="text-xs text-emerald-100 leading-relaxed mb-4">شما ۱۰ جلسه جامع آموزش سواد سلامت رسانه‌ای را پشت سر گذاشتید و اکنون به عنوان سفیر سلامت و ناوبَر آگاه زیست‌کره دیجیتال شناخته می‌شوید.</p>
                            <button onclick="app.selectSession(1)" class="px-5 py-2 bg-white text-emerald-950 font-bold rounded-xl text-xs hover:bg-emerald-50 transition-colors shadow-sm">مرور دوره از جلسه اول</button>
                        </div>
                    </div>
                </div>

        // Start App
        init();

    </script>
