                <div class="h-48 md:h-64 w-full bg-slate-200 relative overflow-hidden">
                    ${session.imageUrl ? `<img src="${session.imageUrl}" alt="${session.title}" class="w-full h-full object-cover" />` : ''}
                    <div class="absolute inset-0 bg-gradient-to-t from-health-950/90 to-transparent flex items-end p-6 md:p-8">
                        <div class="animate-fade-in-up">
                            <span class="inline-block px-3 py-1 bg-health-500/20 backdrop-blur-md border border-health-400/30 text-white text-xs rounded-full mb-2 font-medium">جلسه ${session.id}</span>
                            <h1 class="text-2xl md:text-3xl font-bold text-white shadow-sm">${session.title}</h1>
                            <p class="text-health-50 mt-2 text-sm md:text-base max-w-2xl">${session.description}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTabs() {
            const tabs = [
                { id: 'content', icon: 'book-open', label: 'درسنامه' },
                { id: 'visual', icon: 'eye', label: 'تحلیل تصویری' },
                { id: 'video', icon: 'monitor-play', label: 'ویدیو آموزشی' },
                { id: 'interactive', icon: 'brain-circuit', label: 'بازی و تعامل' },
                { id: 'quiz', icon: 'check-square', label: 'آزمون' },
            ];

            const buttonsHtml = tabs.map(tab => {
                const isActive = state.activeTab === tab.id;
                const activeClass = isActive 
                    ? 'border-health-600 text-health-800 bg-health-50/50' 
                    : 'border-transparent text-slate-500 hover:text-health-600 hover:bg-slate-50';
                const iconClass = isActive ? "text-health-600" : "";

                return `
                    <button
                        onclick="app.setTab('${tab.id}')"
                        class="flex-1 min-w-[100px] py-4 px-4 text-sm font-medium flex flex-col items-center gap-2 border-b-2 transition-all duration-300 ${activeClass}"
                    >
                        <i data-lucide="${tab.icon}" class="w-5 h-5 ${iconClass}"></i>
                        <span class="whitespace-nowrap">${tab.label}</span>
                    </button>
                `;
            }).join('');

            return `<div class="flex border-b overflow-x-auto no-scrollbar">${buttonsHtml}</div>`;
        }

        function renderTabContent(session) {
            switch (state.activeTab) {
                case 'content': return renderContentTab(session);
                case 'visual': return renderVisualTab(session);
                case 'video': return renderVideoTab(session);
                case 'interactive': return renderInteractiveTab(session);
                case 'quiz': return renderQuizTab(session);
                default: return '';
            }
        }

        function renderContentTab(session) {
            return `
                <div class="prose prose-lg prose-slate max-w-none text-justify animate-fade-in">
                    ${session.content}
                    <div class="mt-8 flex justify-end">
                        <button 
                            onclick="app.setTab('visual')"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md"
                        >
                            مرحله بعد: تحلیل تصویری
                        </button>
                    </div>
                </div>
            `;
        }

        function renderVisualTab(session) {
            return `
                <div class="flex flex-col items-center justify-center space-y-6 animate-fade-in">
                    <div class="bg-slate-100 p-2 rounded-xl w-full max-w-2xl shadow-inner relative group">
                        <img 
                            src="${session.imageUrl || "https://picsum.photos/800/600"}" 
                            alt="Visual Analysis" 
                            class="w-full rounded-lg transition-all duration-1000 ease-in-out ${state.visualRevealed ? 'filter-none' : 'blur-md grayscale'}"
                        />
                        ${!state.visualRevealed ? `
                            <div class="absolute inset-0 flex items-center justify-center z-10">
                                <button 
                                    onclick="app.revealVisual()"
                                    class="px-6 py-3 bg-health-600 text-white rounded-full shadow-lg hover:bg-health-700 transform hover:scale-105 transition-all flex items-center gap-2"
                                >
                                    <i data-lucide="eye" class="w-5 h-5"></i>
                                    <span>کلیک برای تحلیل</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    
                    ${state.visualRevealed ? `
                        <div class="max-w-2xl bg-health-50 p-6 rounded-xl border border-health-100 animate-fade-in-up w-full">
                            <h4 class="font-bold text-health-900 mb-2 flex items-center gap-2">
                                <i data-lucide="brain-circuit" class="w-5 h-5 text-health-600"></i>
                                پرسش تحلیلی:
                            </h4>
                            <p class="text-health-800 leading-7">
                                ${session.visualAnalysisPrompt || "به عناصر موجود در تصویر دقت کنید. چه پیامی به صورت پنهان منتقل می‌شود؟"}
                            </p>
                            <div class="mt-4">
                                <textarea 
                                    class="w-full p-3 border border-health-200 rounded-lg text-sm focus:ring-2 focus:ring-health-500 outline-none bg-white" 
                                    placeholder="تحلیل خود را اینجا بنویسید..."
                                    rows="3"
                                ></textarea>
                            </div>
                        </div>
                    ` : ''}
                    <div class="w-full flex justify-end mt-4">
                        <button 
                            onclick="app.setTab('video')"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md"
                        >
                            مرحله بعد: ویدیو
                        </button>
                    </div>
                </div>
            `;
        }

        function renderVideoTab(session) {
            return `
                <div class="flex flex-col items-center animate-fade-in">
                    <div class="w-full max-w-3xl bg-slate-900 rounded-xl overflow-hidden shadow-lg mb-6">
                        ${session.videoUrl ? `
                            <div class="aparat-container">
                                <iframe 
                                    src="${session.videoUrl}" 
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                    title="${session.title}"
                                    webkitallowfullscreen="true"
                                    mozallowfullscreen="true"
                                ></iframe>
                            </div>
                        ` : `
                            <div class="flex items-center justify-center aspect-video text-slate-400 flex-col gap-3 p-12">
                                <i data-lucide="monitor-play" class="w-12 h-12"></i>
                                <p>ویدیو برای این جلسه بارگذاری نشده است.</p>
                            </div>
                        `}
                    </div>
                    <p class="text-slate-600 text-center max-w-2xl mb-8">
                        ویدیو را با دقت تماشا کنید. نکات کلیدی در آزمون پایانی مورد پرسش قرار می‌گیرند.
                    </p>
                    <div class="w-full flex justify-end">
                        <button 
                            onclick="app.setTab('interactive')"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md"
                        >
                            مرحله بعد: بازی
                        </button>
                    </div>
                </div>
            `;
        }

        function renderInteractiveTab(session) {
            if (!session.factOrMyth || session.factOrMyth.length === 0) {
                return `
                    <div class="animate-fade-in">
                        <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-12 text-center text-slate-400">
                            <i data-lucide="brain-circuit" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                            <p>بازی تعاملی برای این جلسه در دسترس نیست.</p>
                        </div>
                        <div class="w-full flex justify-end mt-8">
                            <button onclick="app.setTab('quiz')" class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md">
                                مرحله بعد: آزمون
                            </button>
                        </div>
                    </div>
                `;
            }

            const { currentIndex, score, finished, feedback } = state.game;
            const items = session.factOrMyth;

            if (finished) {
                return `
                    <div class="bg-gradient-to-br from-health-50 to-emerald-50 p-8 rounded-xl text-center border border-health-100 animate-fade-in">
                        <h3 class="text-2xl font-bold text-health-900 mb-4">پایان بازی!</h3>
                        <p class="text-lg text-health-700 mb-6">
                            امتیاز شما: <span class="font-bold text-2xl">${score}</span> از ${items.length}
                        </p>
                        <button 
                            onclick="app.resetGame()"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition shadow-lg shadow-health-200"
                        >
                            شروع مجدد
                        </button>
                        <div class="w-full flex justify-center mt-8">
                            <button onclick="app.setTab('quiz')" class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md">
                                مرحله بعد: آزمون
                            </button>
                        </div>
                    </div>
                `;
            }

            const currentItem = items[currentIndex];
            const progress = ((currentIndex) / items.length) * 100;

            return `
                <div class="max-w-2xl mx-auto animate-fade-in">
                    <div class="mb-6 text-center">
                        <h3 class="text-xl font-bold text-health-800 mb-2">چالش واقعیت یا شایعه</h3>
                        <p class="text-slate-600">کارتهای زیر را بر اساس واقعیت یا شایعه بودن دسته‌بندی کنید.</p>
                    </div>

                    <div class="relative bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden min-h-[300px] flex flex-col">
                        <!-- Progress Bar -->
                        <div class="h-2 bg-slate-100 w-full">
                            <div class="h-full bg-health-500 transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <div class="flex-1 p-8 flex flex-col items-center justify-center text-center animate-fade-in">
                            <div class="mb-6">
                                <span class="bg-health-100 text-health-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                    سوال ${currentIndex + 1} از ${items.length}
                                </span>
                            </div>
                            
                            <h4 class="text-xl md:text-2xl font-bold text-slate-800 leading-normal mb-8">
                                ${currentItem.statement}
                            </h4>

                            ${feedback === null ? `
                                <div class="flex gap-4 w-full max-w-md justify-center">
                                    <button
                                        onclick="app.handleGameGuess(true)"
                                        class="flex-1 py-4 px-6 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 rounded-xl hover:bg-emerald-100 hover:border-emerald-300 transition flex flex-col items-center gap-2"
                                    >
                                        <i data-lucide="thumbs-up" class="w-6 h-6"></i>
                                        <span class="font-bold">واقعیت است</span>
                                    </button>
                                    <button
                                        onclick="app.handleGameGuess(false)"
                                        class="flex-1 py-4 px-6 bg-rose-50 border-2 border-rose-200 text-rose-700 rounded-xl hover:bg-rose-100 hover:border-rose-300 transition flex flex-col items-center gap-2"
                                    >
                                        <i data-lucide="thumbs-down" class="w-6 h-6"></i>
                                        <span class="font-bold">شایعه است</span>
                                    </button>
                                </div>
                            ` : `
                                <div class="w-full p-4 rounded-xl border ${feedback === 'correct' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} animate-fade-in-up">
                                    <div class="flex items-center justify-center gap-2 mb-2 font-bold text-lg">
                                        ${feedback === 'correct' ? `
                                            <span class="text-green-600 flex items-center gap-2"><i data-lucide="check"></i> صحیح!</span>
                                        ` : `
                                            <span class="text-red-600 flex items-center gap-2"><i data-lucide="x"></i> اشتباه!</span>
                                        `}
                                    </div>
                                    <p class="text-slate-700 text-sm">${currentItem.explanation}</p>
                                    <div class="mt-4 text-xs text-slate-400">سوال بعدی در حال بارگذاری...</div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuizTab(session) {
            const questions = session.quiz;
            const { userAnswers, submitted } = state.quiz;
            const isCompleted = state.completedSessions.includes(session.id);

            if (!questions || questions.length === 0) {
                return `
                    <div class="text-center p-8 text-slate-500 bg-slate-50 rounded-lg animate-fade-in">
                        آزمونی برای این جلسه تعریف نشده است.
                    </div>
                `;
            }

            const questionsHtml = questions.map((q, qIdx) => {
                const optionsHtml = q.options.map((opt, oIdx) => {
                    let btnClass = "w-full text-right p-4 rounded-lg border-2 transition-all flex items-center justify-between ";
                    let iconHtml = '';

                    if (submitted) {
                        if (oIdx === q.correctIndex) {
                            btnClass += "bg-green-100 border-green-500 text-green-900";
                            iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600"></i>`;
                        } else if (userAnswers[qIdx] === oIdx && oIdx !== q.correctIndex) {
                            btnClass += "bg-red-50 border-red-300 text-red-900";
                            iconHtml = `<i data-lucide="alert-circle" class="w-5 h-5 text-red-600"></i>`;
                        } else {
                            btnClass += "bg-slate-50 border-transparent text-slate-400 opacity-50";
                        }
                    } else {
                        if (userAnswers[qIdx] === oIdx) {
                            btnClass += "bg-health-50 border-health-500 text-health-900";
                        } else {
                            btnClass += "bg-white border-slate-200 hover:bg-slate-50 text-slate-700";
                        }
                    }

                    return `
                        <button
                            onclick="app.handleQuizSelect(${qIdx}, ${oIdx})"
                            class="${btnClass}"
                            ${submitted ? 'disabled' : ''}
                        >
                            <span>${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white border rounded-xl p-6 shadow-sm">
                        <h4 class="font-bold text-lg mb-4 flex gap-2">
                            <span class="text-health-500">${qIdx + 1}.</span> ${q.text}
                        </h4>
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>
                        ${submitted ? `
                            <div class="mt-4 p-4 bg-blue-50 text-blue-800 rounded-lg text-sm leading-6">
                                <strong>توضیح:</strong> ${q.explanation}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-8 max-w-3xl mx-auto animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-bold text-health-900">آزمون ارزشیابی</h3>
                        ${!submitted ? `
                            <span class="text-sm text-slate-500">${userAnswers.filter(a => a !== -1).length} از ${questions.length} پاسخ داده شده</span>
                        ` : ''}
                    </div>

                    ${questionsHtml}

                    <div class="flex justify-end pt-4">
                        ${!submitted ? `
                            <button 
                                onclick="app.submitQuiz()"
                                class="px-8 py-3 bg-health-700 text-white font-bold rounded-lg shadow hover:bg-health-800 transition-colors flex items-center gap-2"
                            >
                                ثبت پاسخ‌ها
                            </button>
                        ` : `
                            <button 
                                onclick="app.resetQuiz()"
                                class="px-8 py-3 bg-slate-600 text-white font-bold rounded-lg shadow hover:bg-slate-700 transition-colors flex items-center gap-2"
                            >
                                <i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i>
                                آزمون مجدد
                            </button>
                        `}
                    </div>

                    ${isCompleted ? `
                        <div class="mt-8 bg-green-50 border border-green-200 rounded-xl p-6 text-center animate-fade-in-up">
                            <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 rounded-full text-green-600 mb-3">
                                <i data-lucide="check-square" class="w-6 h-6"></i>
                            </div>
                            <h4 class="text-green-800 font-bold text-lg mb-1">جلسه تکمیل شد!</h4>
                            <p class="text-green-700 text-sm">شما این جلسه را با موفقیت گذراندید.</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderContact() {
            return `
                <div class="bg-slate-900 text-white p-12 text-center mt-12">
                    <h2 class="text-3xl font-bold mb-4">ارتباط با ما</h2>
                    <p class="text-slate-400 mb-8">برای همکاری‌های علمی و پژوهشی</p>
                    <div class="flex justify-center gap-6">
                        <a href="mailto:healcono@gmail.com" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300">
                            <i data-lucide="mail"></i> healcono@gmail.com
                        </a>
                        <a href="#" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300">
                            <i data-lucide="instagram"></i> @healthcono
                        </a>
                    </div>
                </div>
            `;
        }

        // Start App
        init();

    </script>
</body>
</html>
