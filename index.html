<!DOCTYPE html>

<head>

    <!-- 1. STABLE CDNs -->

    <!-- 2. CONFIG & STYLES -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        health: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
                            400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
                            800: '#166534', 900: '#14532d', 950: '#052e16',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .prose h3 { color: #14532d; font-weight: 800; font-size: 1.5rem; margin-top: 2.5rem; margin-bottom: 1rem; border-right: 4px solid #22c55e; padding-right: 1rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 2; text-align: justify; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    </style>

</head>
<body class="flex h-screen flex-col md:flex-row">

    <!-- 3. ERROR BOUNDARY (Hidden by default) -->

            <button onclick="location.reload()" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold text-sm hover:bg-red-700 transition">تلاش مجدد</button>

    <!-- 5. MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto relative scroll-smooth bg-slate-50/50" id="main-scroll">
        <!-- Sticky Header -->
        <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">

            </div>
            <div class="flex items-center gap-3">
                <div class="hidden md:flex flex-col items-end mr-4">
                    <span class="text-[10px] text-slate-400 mb-1">پیشرفت دوره</span>
                    <div class="w-24 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-health-500 rounded-full transition-all duration-1000" style="width: 0%"></div>
                    </div>

                <a href="mailto:healcono@gmail.com" class="bg-health-50 text-health-700 hover:bg-health-100 p-2 rounded-full transition-colors" title="ارتباط با مدرس">

    <!-- 6. JAVASCRIPT LOGIC (Zero-Inertia) -->
    <script>
        // --- A. Data Store (Content for Session 1 + Placeholders) ---
        const SESSIONS = [
            {
                id: 1,
                title: "پارادایم جدید در سلامت عمومی",
                content: `
                    <div class="animate-fade-in">
                        <!-- Hero Section -->
                        <div class="relative rounded-2xl overflow-hidden mb-10 shadow-xl border border-slate-100 bg-white group">
                            <div class="absolute inset-0 bg-gradient-to-l from-health-900/90 via-health-800/80 to-transparent z-10"></div>
                            <img src="https://picsum.photos/seed/med1/1000/400" class="w-full h-48 md:h-64 object-cover group-hover:scale-105 transition-transform duration-700" alt="Cover">
                            <div class="absolute inset-0 z-20 flex flex-col justify-end p-6 md:p-8 text-white">
                                <span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs w-fit mb-3 border border-white/10">جلسه اول</span>
                                <h2 class="text-2xl md:text-4xl font-black mb-2 leading-tight">گذار از سواد سنتی به سواد دیجیتال</h2>
                                <p class="text-health-100 text-sm md:text-base opacity-90 max-w-2xl">بررسی پدیده اینفودمیک و تغییر نقش بیمار در عصر شبکه‌های اجتماعی</p>
                            </div>
                        </div>

                        <div class="prose prose-slate max-w-none text-slate-700">
                            <!-- 1. Intro -->
                            <section class="animate-slide-up" style="animation-delay: 0.1s;">
                                <h3>۱. مقدمه: ظهور اتاق‌های انتظار مجازی</h3>
                                <p>در دهه‌های گذشته، سواد سلامت تنها به توانایی خواندن نسخه‌ها یا درک دستورالعمل‌های پزشک محدود می‌شد. اما با ظهور عصر دیجیتال و درهم‌تنیدگی رسانه‌ها با زیست‌جهان انسان، مفهوم جدیدی به نام <strong>سواد سلامت رسانه‌ای (Media Health Literacy)</strong> متولد شد.</p>
                                <p>امروزه رسانه‌ها دیگر صرفاً ابزار انتقال پیام نیستند، بلکه سازنده واقعیت‌های سلامت محور هستند. دانشجویان علوم پزشکی و پیراپزشکی باید بدانند که بیمارِ امروز، پیش از ملاقات با پزشک، در «اتاق‌های انتظار مجازی» و «شبکه‌های اجتماعی» با انبوهی از داده‌ها مواجه شده است که لزوماً همگی علمی نیستند.</p>
                            </section>

                            <!-- 2. Definitions Box -->
                            <div class="grid md:grid-cols-3 gap-4 my-8 animate-slide-up" style="animation-delay: 0.2s;">
                                <div class="bg-white p-5 rounded-xl shadow-sm border-t-4 border-slate-400">
                                    <strong class="block text-slate-800 mb-2 text-lg">سواد سلامت</strong>
                                    <p class="text-sm text-slate-500 m-0 leading-6">ظرفیت کسب، پردازش و درک اطلاعات اولیه سلامت برای تصمیم‌گیری درست.</p>
                                </div>
                                <div class="bg-white p-5 rounded-xl shadow-sm border-t-4 border-slate-400">
                                    <strong class="block text-slate-800 mb-2 text-lg">سواد رسانه‌ای</strong>
                                    <p class="text-sm text-slate-500 m-0 leading-6">توانایی دسترسی، تحلیل، ارزیابی و تولید پیام در قالب‌های مختلف.</p>
                                </div>
                                <div class="bg-health-50 p-5 rounded-xl shadow-sm border-t-4 border-health-500">
                                    <strong class="block text-health-900 mb-2 text-lg">سواد سلامت رسانه‌ای</strong>
                                    <p class="text-sm text-health-800 m-0 leading-6">واکاوی نقادانه‌ی پیام‌های سلامتی که از فیلتر رسانه‌های جمعی عبور کرده‌اند.</p>
                                </div>
                            </div>

                            <!-- 3. Infodemic -->
                            <section class="animate-slide-up" style="animation-delay: 0.3s;">
                                <h3>۳. پدیده اینفودمیک (Infodemic)</h3>
                                <p>واژه‌ی Infodemic (ترکیب Information و Epidemic) به معنای شیوع بیش از حد اطلاعات در حین یک اپیدمی است. در اینفودمیک ما با سه نوع اختلال اطلاعاتی روبرو هستیم:</p>
                                <ul class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <li class="flex items-start gap-2">
                                        <i data-lucide="info" class="w-5 h-5 text-blue-500 mt-1 shrink-0"></i>
                                        <div><strong>Mis-information:</strong> اطلاعات نادرستی که بدون نیت بد منتشر می‌شوند (مثل بازنشر شایعه از روی دلسوزی).</div>
                                    </li>
                                    <li class="flex items-start gap-2 mt-4">
                                        <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500 mt-1 shrink-0"></i>
                                        <div><strong>Dis-information:</strong> اطلاعات غلطی که به عمد برای فریب یا سودجویی تولید می‌شوند (مثل تبلیغ داروی تقلبی).</div>
                                    </li>
                                    <li class="flex items-start gap-2 mt-4">
                                        <i data-lucide="shield-alert" class="w-5 h-5 text-orange-500 mt-1 shrink-0"></i>
                                        <div><strong>Mal-information:</strong> اطلاعات درستی که برای آسیب زدن به یک فرد یا نهاد منتشر می‌شوند.</div>
                                    </li>
                                </ul>
                            </section>

                            <!-- Interactive Case Study -->
                            <div class="my-10 bg-indigo-900 rounded-2xl p-6 md:p-8 text-white shadow-xl relative overflow-hidden group animate-slide-up" style="animation-delay: 0.4s;">
                                <div class="relative z-10">
                                    <h4 class="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-400">
                                        <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                                        تمرین: کالبدشکافی یک شایعه
                                    </h4>
                                    <p class="text-indigo-100 mb-6 bg-white/10 p-4 rounded-lg border-r-2 border-emerald-400">
                                        متن شایعه: "دانشمندان ژاپنی کشف کردند که نوشیدن آب گرم هر ۱۵ دقیقه، ویروس‌ها را به معده می‌برد و اسید معده آن‌ها را نابود می‌کند!"
                                    </p>
                                    <p class="mb-4 text-sm opacity-80">تحلیل شما چیست؟</p>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="case-study-buttons">
                                        <button onclick="handleCaseStudy(false)" class="p-3 bg-white/5 hover:bg-white/20 border border-white/20 rounded-xl text-sm transition text-right">
                                            ✅ معتبر است چون مکانیسم اسید معده علمی است.
                                        </button>
                                        <button onclick="handleCaseStudy(true)" class="p-3 bg-white/5 hover:bg-white/20 border border-white/20 rounded-xl text-sm transition text-right">
                                            ❌ شایعه است (ارجاع مبهم به "دانشمندان ژاپنی").
                                        </button>
                                    </div>
                                    <div id="case-feedback" class="hidden mt-4 p-4 bg-emerald-500/20 rounded-xl border border-emerald-500/50 text-emerald-100 text-sm animate-fade-in"></div>
                                </div>
                                <i data-lucide="search" class="absolute -bottom-10 -left-10 w-48 h-48 text-white opacity-5 group-hover:scale-110 transition-transform duration-1000"></i>
                            </div>

                            <!-- 4. Psychology -->
                            <section class="animate-slide-up" style="animation-delay: 0.5s;">
                                <h3>۴. روانشناسیِ پذیرش شایعه</h3>
                                <p>سواد رسانه‌ای در سلامت مبارزه با خطاهای شناختی است:</p>
                                <div class="grid gap-3">
                                    <div class="flex items-center gap-3 p-3 bg-slate-100 rounded-lg">
                                        <span class="font-bold text-health-700">سوگیری تایید:</span>
                                        <span class="text-sm">پذیرش اطلاعاتی که با باورهای قبلی ما سازگار است.</span>
                                    </div>
                                    <div class="flex items-center gap-3 p-3 bg-slate-100 rounded-lg">
                                        <span class="font-bold text-health-700">اثر تکرار:</span>
                                        <span class="text-sm">مغز تکرار زیاد را معادل حقیقت می‌پندارد.</span>
                                    </div>
                                    <div class="flex items-center gap-3 p-3 bg-slate-100 rounded-lg">
                                        <span class="font-bold text-health-700">اتاق‌های پژواک:</span>
                                        <span class="text-sm">الگوریتم‌ها ما را در محاصره نظرات مشابه خودمان قرار می‌دهند.</span>
                                    </div>
                                </div>
                            </section>

                            <!-- Quiz Section -->
                            <div class="mt-12 pt-8 border-t border-slate-200 animate-slide-up" style="animation-delay: 0.6s;">
                                <h3 class="!mt-0 mb-6 flex items-center gap-2">
                                    <i data-lucide="check-square" class="text-health-600"></i>
                                    آزمون پایان جلسه
                                </h3>
                                <div class="space-y-6" id="quiz-container">
                                    <!-- Quiz rendered by JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                quiz: [
                    { id: 1, text: "تفاوت اصلی Misinformation و Disinformation چیست؟", options: ["تعداد بازدید", "قصد و نیت فرستنده", "پلتفرم انتشار"], correct: 1 },
                    { id: 2, text: "کدام سوگیری باعث می‌شود فقط اخبار موافق نظر خود را بپذیریم؟", options: ["اثر تکرار", "سوگیری تایید", "اثر لنگر"], correct: 1 },
                    { id: 3, text: "واژه Infodemic به چه معناست؟", options: ["همه‌گیری ویروس", "شیوع بیش از حد اطلاعات", "قطع اینترنت"], correct: 1 }
                ]
            },
            // Placeholders for Sessions 2-17
            ...Array.from({ length: 16 }, (_, i) => ({
                id: i + 2,
                title: [
                    "اخبار جعلی و شایعات", "تحلیل تبلیغات پزشکی", "تصویر بدن در مدیا", "ارزیابی منابع آنلاین",
                    "سایبرکندریا", "حریم خصوصی سلامت", "اینفلوئنسرهای پزشکی", "ژورنالیسم سلامت",
                    "هوش مصنوعی در سلامت", "سلامت روان دیجیتال", "مدیریت اسکرین‌تایم", "اپلیکیشن‌های mHealth",
                    "اخلاق در تله‌مدیسین", "تفکر انتقادی در پاندمی", "کودکان و فضای مجازی", "آینده سلامت دیجیتال"
                ][i] || `جلسه ${i + 2}`,
                content: `
                    <div class="text-center py-20 animate-fade-in">
                        <i data-lucide="lock" class="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
                        <h2 class="text-xl font-bold text-slate-700 mb-2">محتوای این جلسه قفل است</h2>
                        <p class="text-slate-500">لطفاً ابتدا جلسات قبلی را تکمیل کنید.</p>
                    </div>
                `,
                quiz: []
            }))
        ];

        // --- B. State Management ---
        let state = {
            currentSessionId: 1,
            completedSessions: JSON.parse(localStorage.getItem('completedSessions') || '[]'),
            quizAnswers: {}
        };

        // --- C. Logic Functions ---
        
        // 1. Render Sidebar
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = SESSIONS.map(session => {
                const isCompleted = state.completedSessions.includes(session.id);
                const isActive = state.currentSessionId === session.id;
                const isLocked = session.id > 1 && !state.completedSessions.includes(session.id - 1);
                
                return `
                    <button 
                        onclick="loadSession(${session.id})"
                        class="w-full text-right px-4 py-3 rounded-lg mb-1 flex items-center justify-between group transition-all duration-200
                        ${isActive ? 'bg-health-50 text-health-900 border border-health-100 shadow-sm' : 'text-slate-600 hover:bg-slate-50'}
                        ${isLocked ? 'opacity-50 cursor-not-allowed' : ''}"
                        ${isLocked ? 'disabled' : ''}
                    >
                        <div class="flex items-center gap-3">
                            <span class="flex items-center justify-center w-6 h-6 rounded-md text-[10px] font-bold 
                                ${isCompleted ? 'bg-health-500 text-white' : (isActive ? 'bg-health-100 text-health-700' : 'bg-slate-100 text-slate-400')}">
                                ${isCompleted ? '<i data-lucide="check" class="w-3 h-3"></i>' : session.id}
                            </span>
                            <span class="text-sm font-medium truncate max-w-[160px]">${session.title}</span>
                        </div>
                        ${isActive ? '<i data-lucide="chevron-left" class="w-4 h-4 text-health-500"></i>' : ''}
                    </button>
                `;
            }).join('');
            lucide.createIcons();
            
            // Update Progress
            const progress = Math.round((state.completedSessions.length / SESSIONS.length) * 100);
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // 2. Load Session
        window.loadSession = function(id) {
            try {
                // Determine lock state (simplified for demo: always allow 1, others need prev completion)
                // For this demo, allow all clicks but show lock content if needed.
                state.currentSessionId = id;
                const session = SESSIONS.find(s => s.id === id);
                
                // Update UI
                document.getElementById('header-title').innerText = session.title;
                document.getElementById('content-display').innerHTML = session.content;
                
                // Render Quiz if exists
                if (session.quiz.length > 0) {
                    renderQuiz(session.quiz);
                }
                
                renderSidebar();
                lucide.createIcons();
                
                // Mobile: close menu after selection
                if(window.innerWidth < 768) {
                    document.getElementById('sidebar-nav').classList.add('hidden');
                }

                // Scroll to top
                document.getElementById('main-scroll').scrollTo(0,0);
            } catch (e) {
                console.error(e);
                alert("خطا در بارگذاری جلسه");
            }
        };

        // 3. Render Quiz
        function renderQuiz(questions) {
            const container = document.getElementById('quiz-container');
            if(!container) return;
            
            container.innerHTML = questions.map((q, idx) => `
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <p class="font-bold text-slate-800 mb-4 text-sm md:text-base">${idx + 1}. ${q.text}</p>
                    <div class="space-y-2">
                        ${q.options.map((opt, optIdx) => `
                            <button onclick="handleQuizAnswer(${idx}, ${optIdx}, ${q.correct}, this)" 
                                class="quiz-btn-${idx} w-full text-right p-3 rounded-lg border border-slate-100 text-sm hover:bg-slate-50 transition-colors text-slate-600">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback-${idx}" class="mt-3 text-sm hidden"></div>
                </div>
            `).join('');
            
            // Add submit button
            container.innerHTML += `
                <button onclick="completeSession()" class="w-full py-3 bg-health-600 hover:bg-health-700 text-white rounded-xl font-bold shadow-lg shadow-health-200 transition-all mt-4 flex justify-center items-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                    تکمیل و ثبت این جلسه
                </button>
            `;
        }

        // 4. Handle Quiz Logic
        window.handleQuizAnswer = function(qIdx, optIdx, correctIdx, btn) {
            const btns = document.getElementsByClassName(`quiz-btn-${qIdx}`);
            const feedback = document.getElementById(`feedback-${qIdx}`);
            
            // Reset styles
            Array.from(btns).forEach(b => {
                b.className = "w-full text-right p-3 rounded-lg border border-slate-100 text-sm opacity-50 cursor-not-allowed";
                b.disabled = true;
            });

            // Apply result
            feedback.classList.remove('hidden');
            if (optIdx === correctIdx) {
                btn.className = "w-full text-right p-3 rounded-lg border border-green-200 bg-green-50 text-green-700 font-bold";
                feedback.innerHTML = "<span class='text-green-600'>✅ صحیح است!</span>";
            } else {
                btn.className = "w-full text-right p-3 rounded-lg border border-red-200 bg-red-50 text-red-700";
                feedback.innerHTML = "<span class='text-red-600'>❌ اشتباه است.</span>";
            }
        };

        // 5. Complete Session
        window.completeSession = function() {
            if (!state.completedSessions.includes(state.currentSessionId)) {
                state.completedSessions.push(state.currentSessionId);
                localStorage.setItem('completedSessions', JSON.stringify(state.completedSessions));
                
                // Show celebration
                const btn = event.currentTarget;
                btn.innerHTML = "ثبت شد!";
                btn.classList.add("bg-slate-800");
                
                setTimeout(() => {
                    renderSidebar();
                    // Auto advance logic could go here
                }, 1000);
            }
        };

        // 6. Case Study Logic
        window.handleCaseStudy = function(isCorrect) {
            const feedback = document.getElementById('case-feedback');
            const buttons = document.getElementById('case-study-buttons');
            
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.innerHTML = "<strong>آفرین!</strong> 👏 دقیقا همینطور است. استفاده از عبارات کلی مثل 'دانشمندان' بدون ذکر منبع دقیق، و ادعاهای فیزیولوژیک ساده‌انگارانه (مثل شستن ویروس با آب) از ویژگی‌های بارز اخبار زرد سلامت است.";
                feedback.className = "mt-4 p-4 bg-emerald-600 text-white rounded-xl shadow-lg";
            } else {
                feedback.innerHTML = "<strong>دقت کنید!</strong> ⚠️ مکانیزم اسید معده پیچیده است اما ویروس‌های تنفسی (مثل کرونا یا آنفولانزا) از طریق مجاری تنفسی وارد سلول می‌شوند، نه معده. این یک شایعه کلاسیک است.";
                feedback.className = "mt-4 p-4 bg-rose-100 text-rose-800 border border-rose-200 rounded-xl";
            }
        };

        // 7. Mobile Menu
        window.toggleMobileMenu = function() {
            const nav = document.getElementById('sidebar-nav');
            nav.classList.toggle('hidden');
            nav.classList.toggle('h-auto');
        }

        // --- D. Initialization (Zero-Inertia) ---
        window.addEventListener('DOMContentLoaded', () => {
            try {
                renderSidebar();
                loadSession(1);
            } catch (error) {
                console.error("Critical Init Error:", error);
                document.getElementById('error-boundary').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
