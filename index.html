        const sessions = [
            {
                id: 1,
                title: "پارادایم جدید در سلامت عمومی",
                description: "گذار از سواد سنتی به سواد دیجیتال و بررسی پدیده اینفودمیک.",

                    <div class="space-y-8 animate-fade-in">
                        <section>

                            </h3>
                            <p>
                                در دهه‌های گذشته، سواد سلامت تنها به توانایی خواندن نسخه‌ها یا درک دستورالعمل‌های پزشک محدود می‌شد. اما با ظهور عصر دیجیتال و درهم‌تنیدگی رسانه‌ها با زیست‌جهان انسان، مفهوم جدیدی به نام <strong>سواد سلامت رسانه‌ای (Media Health Literacy)</strong> متولد شد.
                            </p>
                            <p>
                                امروزه رسانه‌ها دیگر صرفاً ابزار انتقال پیام نیستند، بلکه سازنده واقعیت‌های سلامت محور هستند. دانشجویان علوم پزشکی و پیراپزشکی باید بدانند که بیمارِ امروز، پیش از ملاقات با پزشک، در «اتاق‌های انتظار مجازی» و «شبکه‌های اجتماعی» با انبوهی از داده‌ها مواجه شده است که لزوماً همگی علمی نیستند.
                            </p>
                        </section>

                        <div class="bg-[#bad4c4] border-r-4 border-health-600 p-6 rounded-l-2xl my-6" style="background-color: #bad4c4;">
                            <strong class="text-health-950 block mb-2 text-lg">سواد سلامت رسانه‌ای (MHL)</strong>
                            <p class="text-health-950 m-0 font-medium">نقطه‌ی تلاقی سواد سلامت و سواد رسانه‌ای که به معنای مهارتِ واکاوی نقادانه‌ی پیام‌های سلامتی است که از فیلتر رسانه‌های جمعی و اجتماعی عبور کرده‌اند.</p>
                        </div>

                        <section>
                            <h3 class="text-2xl font-bold text-health-900 mb-4">۳. پدیده اینفودمیک (Infodemic) و سلامت عمومی</h3>
                            <p>
                                واژه‌ی <strong>Infodemic</strong> به معنای شیوع بیش از حد اطلاعات (درست یا نادرست) در حین یک اپیدمی است. در اینفودمیک، ما با سه نوع اختلال اطلاعاتی روبرو هستیم:
                            </p>
                            <div class="grid md:grid-cols-3 gap-4 mt-6">
                                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 text-sm text-blue-950">
                                    <strong class="text-blue-900 block mb-1">Mis-information</strong>

                                </div>
                                <div class="bg-orange-50 p-5 rounded-2xl border border-orange-100 text-sm text-orange-950">
                                    <strong class="text-orange-900 block mb-1">Mal-information</strong>
                                    اطلاعات درستی که برای آسیب زدن منتشر می‌شوند.
                                </div>
                            </div>
                        </section>

                        <section class="bg-slate-900 text-white p-8 rounded-3xl shadow-xl mt-8">

                    }
                    if (state.isFactCheckModalOpen) {
                        app.closeFactCheckModal();
                        return;
                    }
                    if (state.isFlashcardsModalOpen) {
                        app.closeFlashcardsModal();
                        return;
                    }
                    if (state.isNotesModalOpen) {
                        app.closeNotesModal();
                        return;
                    }
                    if (state.isDilemmasModalOpen) {
                        app.closeDilemmasModal();
                        return;
                    }
                    if (state.isBackupModalOpen) {
                        app.closeBackupModal();
                        return;
                    }
                }

                // Infographic lightbox navigation
                if (state.selectedInfographicIndex !== null) {
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        app.prevInfographic();
                        return;
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        app.nextInfographic();
                        return;
                    } else if (e.key === '+' || e.key === '=') {
                        e.preventDefault();
                        app.zoomInfographic(0.25);
                        return;
                    } else if (e.key === '-' || e.key === '_') {
                        e.preventDefault();
                        app.zoomInfographic(-0.25);
                        return;
                    } else if (e.key === '0') {
                        e.preventDefault();
                        app.resetInfographicZoom();
                        return;
                    }
                }

                if (e.key === '/') {
                    e.preventDefault();
                    app.focusSearch();
                } else if (e.key === '[' || e.key === 'BracketLeft') {
                    app.prevSession();
                } else if (e.key === ']' || e.key === 'BracketRight') {
                    app.nextSession();
                }
            });

            renderApp();
        }

                const session = sessions.find(s => s.id === state.currentSessionId);

                    alert("لطفاً به تمام سوالات پاسخ دهید.");
                    return;
                }
                
                state.quiz.submitted = true;
                
                // Calculate score
                const score = state.quiz.userAnswers.reduce((acc, ans, idx) => {
                    return acc + (ans === session.quiz[idx].correctIndex ? 1 : 0);
                }, 0);

                // Mark complete if score > 50%
                if (score >= Math.ceil(session.quiz.length / 2)) {
                    if (!state.completedSessions.includes(session.id)) {
                        state.completedSessions.push(session.id);
                        localStorage.setItem('completedSessions', JSON.stringify(state.completedSessions));

            importBackupJson: (event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed || (parsed.app !== "HealthMediaLiteracyTracker" && !parsed.completedSessions)) {
                            throw new Error("فرمت فایل پشتیبان نامعتبر است");
                        }

                        if (Array.isArray(parsed.completedSessions)) {
                            state.completedSessions = parsed.completedSessions;
                            localStorage.setItem('completedSessions', JSON.stringify(state.completedSessions));
                        }
                        if (Array.isArray(parsed.bookmarkedSessions)) {
                            state.bookmarkedSessions = parsed.bookmarkedSessions;
                            localStorage.setItem('bookmarkedSessions', JSON.stringify(state.bookmarkedSessions));
                        }
                        if (Array.isArray(parsed.checkedObjectives)) {
                            state.checkedObjectives = parsed.checkedObjectives;
                            localStorage.setItem('checkedObjectives', JSON.stringify(state.checkedObjectives));
                        }
                        if (parsed.sessionNotes && typeof parsed.sessionNotes === 'object') {
                            state.sessionNotes = parsed.sessionNotes;
                            localStorage.setItem('studentSessionNotes', JSON.stringify(state.sessionNotes));
                        }
                        if (Array.isArray(parsed.masteredCards)) {
                            state.masteredCards = parsed.masteredCards;
                            localStorage.setItem('masteredFlashcards', JSON.stringify(state.masteredCards));
                        }
                        if (parsed.dilemmaChoices && typeof parsed.dilemmaChoices === 'object') {
                            state.dilemmaChoices = parsed.dilemmaChoices;
                            localStorage.setItem('dilemmaChoices', JSON.stringify(state.dilemmaChoices));
                        }
                        if (parsed.studentName) {
                            state.studentName = parsed.studentName;
                            localStorage.setItem('studentName', state.studentName);
                        }
                        if (typeof parsed.isDarkMode === 'boolean') {
                            state.isDarkMode = parsed.isDarkMode;
                            localStorage.setItem('isDarkMode', state.isDarkMode.toString());
                            applyTheme();
                        }

                        state.isBackupModalOpen = false;
                        renderApp();
                        app.showToast('اطلاعات پشتیبان با موفقیت بازیابی شد! 🎉');
                    } catch (err) {
                        console.error('Backup import parse error:', err);
                        app.showToast('خطا در خواندن فایل پشتیبان: ساختار فایل معتبر نیست');
                    }
                };
                reader.readAsText(file);
            },
            resetAllUserData: () => {
                if (confirm('آیا از بازنشانی کامل کلیه سوابق، آزمون‌ها، نشان‌ها و یادداشت‌های خود اطمینان دارید؟ این عملیات غیرقابل بازگشت است.')) {
                    state.completedSessions = [];
                    state.bookmarkedSessions = [];
                    state.checkedObjectives = [];
                    state.sessionNotes = {};
                    state.masteredCards = [];
                    state.dilemmaChoices = {};
                    state.studentName = '';

                    localStorage.removeItem('completedSessions');
                    localStorage.removeItem('bookmarkedSessions');
                    localStorage.removeItem('checkedObjectives');
                    localStorage.removeItem('studentSessionNotes');
                    localStorage.removeItem('masteredFlashcards');
                    localStorage.removeItem('dilemmaChoices');
                    localStorage.removeItem('studentName');

                    state.isBackupModalOpen = false;
                    renderApp();
                    app.showToast('کلیه داده‌های محلی با موفقیت بازنشانی گردید');
                }
            }
        };

        function renderApp() {
            const root = document.getElementById('app-root');
            const currentSession = sessions.find(s => s.id === state.currentSessionId) || sessions[0];
            
            // Preserve reading scroll position
            const prevMainContent = document.getElementById('main-content');
            const prevScrollTop = prevMainContent ? prevMainContent.scrollTop : null;

            // Check if search input was previously focused
            const activeEl = document.activeElement;
            const wasSearchFocused = activeEl && activeEl.id === 'sidebar-search-input';
            const selectionStart = wasSearchFocused ? activeEl.selectionStart : null;
            const selectionEnd = wasSearchFocused ? activeEl.selectionEnd : null;

            const mainHtml = state.currentView === 'infographics' 
                ? renderInfographicsView() 
                : renderMainContent(currentSession);

            root.innerHTML = `
                ${renderMobileHeader()}
                ${renderSidebarOverlay()}
                ${renderSidebar()}
                ${mainHtml}
                ${renderPdfExportModal()}
                ${renderFactCheckModal()}
                ${renderFlashcardsModal()}
                ${renderNotesModal()}
                ${renderDilemmasModal()}
                ${renderBackupModal()}
            `;
            
            // Initialize Icons
            lucide.createIcons();

            // Restore scroll position so font size or theme toggle doesn't jump
            if (prevScrollTop !== null) {
                const newMainContent = document.getElementById('main-content');
                if (newMainContent) {
                    newMainContent.scrollTop = prevScrollTop;
                }
            }
            lucide.createIcons();

            // Restore scroll position so font size or theme toggle doesn't jump
            if (prevScrollTop !== null) {
                const newMainContent = document.getElementById('main-content');
                if (newMainContent) {
                    newMainContent.scrollTop = prevScrollTop;
                }
            }

            // Setup scroll listeners for progress bar and scroll-to-top
            if (typeof setupScrollEvents === 'function') {
                setupScrollEvents();
            }

            // Restore search input focus and cursor if typing
            if (wasSearchFocused) {
                const searchInput = document.getElementById('sidebar-search-input');
                if (searchInput) {
                    searchInput.focus();
                    if (selectionStart !== null && selectionEnd !== null) {
                        searchInput.setSelectionRange(selectionStart, selectionEnd);
                    }
                }
            }
        }

        // Synchronize scroll position with reading progress bar and scroll-to-top button
        function setupScrollEvents() {
            const mainContent = document.getElementById('main-content');
            const btn = document.getElementById('scroll-to-top');
            const progressBar = document.getElementById('reading-progress-bar');
            
            if (!mainContent) return;

            mainContent.onscroll = () => {
                const scrollTop = mainContent.scrollTop;
                const scrollHeight = mainContent.scrollHeight - mainContent.clientHeight;
                
                // Update reading progress bar
                if (progressBar && scrollHeight > 0) {
                    const pct = Math.min(100, Math.max(0, Math.round((scrollTop / scrollHeight) * 100)));
                    progressBar.style.width = pct + '%';
                }

                // Toggle scroll-to-top button
                if (btn) {
                    if (scrollTop > 260) {
                        btn.classList.remove('opacity-0', 'invisible', 'translate-y-10');
                    } else {
                        btn.classList.add('opacity-0', 'invisible', 'translate-y-10');
                    }
                }
            };
        }

        // Global listeners
        window.addEventListener('resize', setupScrollEvents);
        setTimeout(setupScrollEvents, 100);

        function renderQuizTab(session) {
            const questions = session.quiz;
            const { userAnswers, submitted } = state.quiz;
            const isCompleted = state.completedSessions.includes(session.id);

            if (!questions || questions.length === 0) {
                return `
                    <div class="text-center p-8 text-slate-500 bg-slate-50 rounded-2xl animate-fade-in border border-slate-200">
                        آزمونی برای این جلسه تعریف نشده است.
                    </div>
                `;
            }

            const questionsHtml = questions.map((q, qIdx) => {
                const optionsHtml = q.options.map((opt, oIdx) => {
                    let btnClass = "w-full text-right p-4 rounded-xl border-2 transition-all flex items-center justify-between ";
                    let iconHtml = '';

                    if (submitted) {
                        if (oIdx === q.correctIndex) {
                            btnClass += "bg-[#F4F8F5] border-emerald-500 text-emerald-950 font-semibold";
                            iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i>`;
                        } else if (userAnswers[qIdx] === oIdx && oIdx !== q.correctIndex) {
                            btnClass += "bg-[#FDF2F4] border-rose-300 text-rose-950 font-semibold";
                            iconHtml = `<i data-lucide="alert-circle" class="w-5 h-5 text-rose-600"></i>`;
                        } else {
                            btnClass += "bg-slate-50 border-transparent text-slate-400 opacity-50";
                        }
                    } else {
                        if (userAnswers[qIdx] === oIdx) {
                            btnClass += "bg-[#FAF6F8] border-[#4B2E83] text-[#35224F] font-semibold";
                        } else {
                            btnClass += "bg-white border-slate-200 hover:bg-[#FAF8F6] hover:border-[#7A5C9E] text-slate-700";
                        }
                    }

                    return `
                        <button
                            onclick="app.handleQuizSelect(${qIdx}, ${oIdx})"
                            class="${btnClass}"
                            ${submitted ? 'disabled' : ''}
                        >
                            <span>${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white border border-[rgba(75,46,131,0.12)] rounded-2xl p-6 shadow-xs">
                        <h4 class="font-bold text-base md:text-lg mb-4 flex gap-2 font-display text-[#27232A]">
                            <span class="text-[#4B2E83] font-bold">${qIdx + 1}.</span> ${q.text}
                        </h4>
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>
                        ${submitted ? `
                            <div class="mt-4 p-4 bg-[#F3EDF6] text-[#35224F] border border-[rgba(75,46,131,0.14)] rounded-xl text-sm leading-6 font-serif">
                                <strong>توضیح:</strong> ${q.explanation}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-8 max-w-3xl mx-auto animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-bold text-[#35224F] font-display">آزمون ارزشیابی و سنجش درک</h3>
                        ${!submitted ? `
                            <span class="text-sm text-slate-500">${userAnswers.filter(a => a !== -1).length} از ${questions.length} پاسخ داده شده</span>
                        ` : ''}
                    </div>

                    ${questionsHtml}

                    <div class="flex justify-end pt-4">
                        ${!submitted ? `
                            <button 
                                onclick="app.submitQuiz()"
                                class="px-8 py-3 bg-[#4B2E83] text-white font-bold rounded-xl shadow-xs hover:bg-[#3D256E] transition-colors flex items-center gap-2"
                            >
                                ثبت پاسخ‌ها
                            </button>
                        ` : `
                            <button

                                class="px-8 py-3 bg-slate-700 text-white font-bold rounded-xl shadow hover:bg-slate-800 transition-colors flex items-center gap-2"
                            >
                                <i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i>
                                آزمون مجدد
                            </button>

                    ${isCompleted ? `

                                                <h3 class="font-extrabold text-[#27232A] text-base leading-snug group-hover:text-[#4B2E83] transition-colors font-display">
                                                    ${item.title}
                                                </h3>
                                                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed font-serif">
                                                    ${item.subtitle}
                                                </p>
                                            </div>

                                            <!-- Key Bullet Points Preview -->
                                            <div class="bg-white/70 p-3 rounded-xl border border-[rgba(75,46,131,0.08)] space-y-1.5 font-serif">
                                                <span class="text-[10px] font-bold text-slate-400 block mb-1 font-sans">محورهای کلیدی این اینفوگرافیک:</span>
                                                ${item.points.slice(0, 3).map(pt => `
                                                    <div class="flex items-start gap-1.5 text-[11px] text-slate-600 leading-snug">
                                                        <i data-lucide="check" class="w-3 h-3 text-[#4B2E83] mt-0.5 flex-shrink-0"></i>
                                                        <span class="truncate">${pt}</span>
                                                    </div>
                                                `).join('')}
                                            </div>

                                            <!-- Card Actions -->
                                            <div class="pt-2 border-t border-[rgba(75,46,131,0.10)] flex items-center justify-between gap-2">
                                                <button 
                                                    onclick="app.openInfographicModal(${idx})" 
                                                    class="flex-1 py-2 px-3 bg-[#4B2E83] hover:bg-[#3D256E] text-white text-xs font-bold rounded-xl transition-colors inline-flex items-center justify-center gap-1.5 shadow-2xs"
                                                >
                                                    <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                                    <span>نمایش جزئیات و تحلیل</span>
                                                </button>
                                                <a 
                                                    href="${item.remoteSrc}" 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    download 
                                                    title="دانلود مستقیم تصویر اصلی"
                                                    class="p-2 border border-slate-200 hover:border-[#7A5C9E] hover:bg-[#FAF6F8] text-slate-600 hover:text-[#4B2E83] rounded-xl transition-all"
                                                >
                                                    <i data-lucide="download" class="w-4 h-4"></i>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- Game Banner -->
                        ${renderDidebanGameBanner()}

                        <!-- Footer -->
                        ${renderSiteFooter()}
                    </div>

                    <!-- Lightbox Modal for Infographic Full Preview -->
                    ${selectedInfo ? renderInfographicModal(selectedInfo) : ''}
                </main>
            `;
        }

        function renderInfographicModal(item) {
            const zoom = state.infographicZoom || 1;
            const currentIndex = state.selectedInfographicIndex;
            const total = infographics.length;

            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 md:p-6 bg-slate-950/85 backdrop-blur-md animate-fade-in" onclick="if(event.target === this) app.closeInfographicModal()">
                    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-5xl max-h-[95vh] flex flex-col overflow-hidden relative" onclick="event.stopPropagation()">
                        
                        <!-- Modal Header Toolbar -->
                        <div class="px-5 py-3.5 bg-[#271738] text-white flex items-center justify-between gap-3 border-b border-white/10 flex-shrink-0">
                            <div class="flex items-center gap-3 min-w-0">
                                <span class="px-2 py-0.5 rounded-md bg-[#4B2E83] text-white text-xs font-bold border border-white/10">
                                    نگاره ${item.number} از ${total}
                                </span>
                                <h3 class="text-sm font-bold text-slate-100 truncate font-display">${item.title}</h3>
                            </div>

                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <!-- Zoom Controls -->
                                <div class="inline-flex bg-white/10 rounded-lg p-0.5 border border-white/10 ml-2">
                                    <button onclick="app.zoomInfographic(-0.25)" title="کوچک‌نمایی (-)" class="p-1.5 text-slate-300 hover:text-white rounded transition-colors">
                                        <i data-lucide="zoom-out" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="app.resetInfographicZoom()" title="اندازه واقعی (0)" class="px-2 py-0.5 text-xs font-mono text-[#DABFCC] hover:text-white">
                                        ${Math.round(zoom * 100)}%
                                    </button>
                                    <button onclick="app.zoomInfographic(0.25)" title="بزرگ‌نمایی (+)" class="p-1.5 text-slate-300 hover:text-white rounded transition-colors">
                                        <i data-lucide="zoom-in" class="w-4 h-4"></i>
                                    </button>
                                </div>

                                <!-- External Download Link -->
                                <a href="${item.remoteSrc}" target="_blank" rel="noopener noreferrer" title="دانلود تصویر اصلی" class="p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition-colors">
                                    <i data-lucide="download" class="w-4 h-4"></i>
                                </a>

                                <!-- Close Button -->
                                <button onclick="app.closeInfographicModal()" title="بستن (Esc)" class="p-2 text-slate-400 hover:text-white hover:bg-rose-500/20 rounded-lg transition-colors ml-1">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Modal Body: Image Stage with pan/zoom container -->
                        <div class="flex-1 overflow-auto bg-slate-950/95 flex items-center justify-center p-4 relative select-none">
                            <!-- Prev Navigation Button -->
                            <button 
                                onclick="app.prevInfographic()" 
                                title="اینفوگرافیک قبلی (کلید راست)"
                                class="absolute right-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 text-white backdrop-blur-md flex items-center justify-center transition-all shadow-lg hover:scale-110"
                            >
                                <i data-lucide="chevron-right" class="w-6 h-6"></i>
                            </button>

                            <!-- Next Navigation Button -->
                            <button 
                                onclick="app.nextInfographic()" 
                                title="اینفوگرافیک بعدی (کلید چپ)"
                                class="absolute left-4 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 text-white backdrop-blur-md flex items-center justify-center transition-all shadow-lg hover:scale-110"
                            >
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                            </button>

                            <!-- Display Image -->
                            <div class="transition-transform duration-200 max-w-full max-h-full flex items-center justify-center" style="transform: scale(${zoom}); transform-origin: center center;">
                                <img 
                                    src="${item.localSrc}" 
                                    alt="${item.title}"
                                    onerror="if(this.src !== '${item.remoteSrc}'){ this.src = '${item.remoteSrc}'; }"
                                    class="max-w-full max-h-[65vh] object-contain rounded-lg shadow-2xl"
                                />
                            </div>
                        </div>

                        <!-- Modal Footer: Academic Description and Checklist Points -->
                        <div class="p-4 md:p-5 bg-white border-t border-slate-200 flex-shrink-0">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-3">
                                <div>
                                    <h4 class="font-extrabold text-[#27232A] text-sm md:text-base font-display">${item.title}</h4>
                                    <p class="text-xs text-slate-500 mt-0.5 font-serif">${item.subtitle}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-[11px] text-slate-400 hidden sm:inline font-sans">کلیدهای میانبر: Esc برای خروج • ← → برای پیمایش</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                ${item.points.map(pt => `
                                    <div class="flex items-start gap-1.5 text-xs text-slate-700 bg-[#FAF8F6] p-2 rounded-lg border border-[rgba(75,46,131,0.08)] font-serif">
                                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-[#4B2E83] mt-0.5 flex-shrink-0"></i>
                                        <span class="leading-snug">${pt}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }


        function renderContact() {
            return `
                <div class="mt-8">
                    <!-- Session 10 Specific Completion Banner -->
                    <div class="bg-gradient-to-r from-[#271738] via-[#35224F] to-[#4B2E83] text-white p-8 text-center rounded-2xl shadow-lg border border-[rgba(216,198,190,0.20)] relative overflow-hidden">
                        <div class="relative z-10 max-w-xl mx-auto">
                            <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-white/20">
                                <i data-lucide="graduation-cap" class="w-7 h-7 text-[#DABFCC]"></i>
                            </div>
                            <h3 class="text-2xl font-black mb-2 font-display">تبریک! دوره سواد سلامت رسانه‌ای تکمیل شد</h3>
                            <p class="text-xs text-[#FAF8F6]/85 leading-relaxed mb-4 font-serif">شما ۱۰ جلسه جامع آموزش سواد سلامت رسانه‌ای را پشت سر گذاشتید و اکنون به عنوان سفیر سلامت و ناوبَر آگاه زیست‌کره دیجیتال شناخته می‌شوید.</p>
                            <button onclick="app.selectSession(1)" class="px-5 py-2 bg-white text-[#27232A] font-bold rounded-xl text-xs hover:bg-[#FAF8F6] transition-colors shadow-sm">مرور دوره از جلسه اول</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Start App
        init();

    </script>
</body>
</html>
