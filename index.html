                        correctAnswer: 1
                    },
                    {
                        question: "نتیکت (Netiquette) به چه معناست؟",
                        options: ["سرعت اینترنت", "آداب و اخلاق معاشرت در فضای مجازی", "روش‌های هک کردن", "نوعی شبکه اجتماعی"],
                        correctAnswer: 1
                    },
                    {
                        question: "اگر از درستی یک خبر مطمئن نیستیم، بهترین کار چیست؟",
                        options: ["ارسال برای همه گروه‌ها", "پرسیدن از ادمین کانال", "قطع زنجیره شایعه و عدم بازنشر", "لایک کردن آن"],
                        correctAnswer: 2
                    }

        // --- STATE MANAGEMENT ---
        const state = {
            currentSessionId: 1,
            completedSessions: [],
            activeTab: 'content',
            visualRevealed: false,
            isSidebarOpen: false,
            game: {
                currentIndex: 0,
                score: 0,
                finished: false,
                feedback: null, // 'correct' | 'incorrect' | null
                feedbackTimeout: null
            },
            quiz: {
                userAnswers: [],
                submitted: false
            }
        };

        // --- INITIALIZATION ---
        function init() {
            // Load progress
            const saved = localStorage.getItem('completedSessions');
            if (saved) {
                try {
                    state.completedSessions = JSON.parse(saved);
                } catch (e) {
                    console.error("Failed to parse saved progress", e);
                }
            }

            // Init quiz state for first session
            resetQuizState(sessions[0]);
            
            renderApp();
        }

        function resetGameState() {
            if (state.game.feedbackTimeout) clearTimeout(state.game.feedbackTimeout);
            state.game = {
                currentIndex: 0,
                score: 0,
                finished: false,
                feedback: null,
                feedbackTimeout: null
            };
        }

        function resetQuizState(session) {
            state.quiz = {
                userAnswers: new Array(session.quiz.length).fill(-1),
                submitted: false
            };
        }

        // --- ACTIONS ---
        window.app = {
            selectSession: (id) => {
                state.currentSessionId = id;
                state.activeTab = 'content';
                state.visualRevealed = false;
                state.isSidebarOpen = false;
                
                const session = sessions.find(s => s.id === id);
                resetGameState();
                resetQuizState(session);
                
                renderApp();
            },
            
            toggleSidebar: () => {
                state.isSidebarOpen = !state.isSidebarOpen;
                renderApp();
            },

            setTab: (tabId) => {
                state.activeTab = tabId;
                renderApp();
            },

            revealVisual: () => {
                state.visualRevealed = true;
                renderApp();
            },

            // Game Actions
            handleGameGuess: (guessIsFact) => {
                const session = sessions.find(s => s.id === state.currentSessionId);
                const items = session.factOrMyth;
                const currentItem = items[state.game.currentIndex];
                const isCorrect = guessIsFact === currentItem.isFact;

                state.game.feedback = isCorrect ? 'correct' : 'incorrect';
                if (isCorrect) state.game.score++;
                
                renderApp();

                state.game.feedbackTimeout = setTimeout(() => {
                    state.game.feedback = null;
                    if (state.game.currentIndex < items.length - 1) {
                        state.game.currentIndex++;
                    } else {
                        state.game.finished = true;
                    }
                    renderApp();
                }, 2500);
            },

            resetGame: () => {
                resetGameState();
                renderApp();
            },

            // Quiz Actions
            handleQuizSelect: (qIdx, oIdx) => {
                if (state.quiz.submitted) return;
                state.quiz.userAnswers[qIdx] = oIdx;
                renderApp();
            },

            submitQuiz: () => {
                const session = sessions.find(s => s.id === state.currentSessionId);
                if (state.quiz.userAnswers.includes(-1)) {
                    alert("لطفاً به تمام سوالات پاسخ دهید.");
                    return;
                }
                
                state.quiz.submitted = true;
                
                // Calculate score
                const score = state.quiz.userAnswers.reduce((acc, ans, idx) => {
                    return acc + (ans === session.quiz[idx].correctIndex ? 1 : 0);
                }, 0);

                // Mark complete if score > 50%
                if (score >= Math.ceil(session.quiz.length / 2)) {
                    if (!state.completedSessions.includes(session.id)) {
                        state.completedSessions.push(session.id);
                        localStorage.setItem('completedSessions', JSON.stringify(state.completedSessions));
                    }
                }
                renderApp();
            },

            resetQuiz: () => {
                const session = sessions.find(s => s.id === state.currentSessionId);
                resetQuizState(session);
                renderApp();
            }

                            <p>بازی تعاملی برای این جلسه در دسترس نیست.</p>
                        </div>
                        <div class="w-full flex justify-end mt-8">
                            <button onclick="app.setTab('quiz')" class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md">
                                مرحله بعد: آزمون
                            </button>
                        </div>
                    </div>
                `;
            }

            const { currentIndex, score, finished, feedback } = state.game;
            const items = session.factOrMyth;

            if (finished) {
                return `
                    <div class="bg-gradient-to-br from-health-50 to-emerald-50 p-8 rounded-xl text-center border border-health-100 animate-fade-in">
                        <h3 class="text-2xl font-bold text-health-900 mb-4">پایان بازی!</h3>
                        <p class="text-lg text-health-700 mb-6">
                            امتیاز شما: <span class="font-bold text-2xl">${score}</span> از ${items.length}
                        </p>
                        <button 
                            onclick="app.resetGame()"
                            class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition shadow-lg shadow-health-200"
                        >
                            شروع مجدد
                        </button>
                        <div class="w-full flex justify-center mt-8">
                            <button onclick="app.setTab('quiz')" class="px-6 py-2 bg-health-600 text-white rounded-lg hover:bg-health-700 transition-colors shadow-sm hover:shadow-md">
                                مرحله بعد: آزمون
                            </button>
                        </div>
                    </div>
                `;
            }

            const currentItem = items[currentIndex];
            const progress = ((currentIndex) / items.length) * 100;

            return `
                <div class="max-w-2xl mx-auto animate-fade-in">
                    <div class="mb-6 text-center">
                        <h3 class="text-xl font-bold text-health-800 mb-2">چالش واقعیت یا شایعه</h3>
                        <p class="text-slate-600">کارتهای زیر را بر اساس واقعیت یا شایعه بودن دسته‌بندی کنید.</p>
                    </div>

                    <div class="relative bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden min-h-[300px] flex flex-col">
                        <!-- Progress Bar -->
                        <div class="h-2 bg-slate-100 w-full">
                            <div class="h-full bg-health-500 transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <div class="flex-1 p-8 flex flex-col items-center justify-center text-center animate-fade-in">
                            <div class="mb-6">
                                <span class="bg-health-100 text-health-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                    سوال ${currentIndex + 1} از ${items.length}
                                </span>
                            </div>
                            
                            <h4 class="text-xl md:text-2xl font-bold text-slate-800 leading-normal mb-8">
                                ${currentItem.statement}
                            </h4>

                            ${feedback === null ? `
                                <div class="flex gap-4 w-full max-w-md justify-center">
                                    <button
                                        onclick="app.handleGameGuess(true)"
                                        class="flex-1 py-4 px-6 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 rounded-xl hover:bg-emerald-100 hover:border-emerald-300 transition flex flex-col items-center gap-2"
                                    >
                                        <i data-lucide="thumbs-up" class="w-6 h-6"></i>
                                        <span class="font-bold">واقعیت است</span>
                                    </button>
                                    <button
                                        onclick="app.handleGameGuess(false)"
                                        class="flex-1 py-4 px-6 bg-rose-50 border-2 border-rose-200 text-rose-700 rounded-xl hover:bg-rose-100 hover:border-rose-300 transition flex flex-col items-center gap-2"
                                    >
                                        <i data-lucide="thumbs-down" class="w-6 h-6"></i>
                                        <span class="font-bold">شایعه است</span>
                                    </button>
                                </div>
                            ` : `
                                <div class="w-full p-4 rounded-xl border ${feedback === 'correct' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} animate-fade-in-up">
                                    <div class="flex items-center justify-center gap-2 mb-2 font-bold text-lg">
                                        ${feedback === 'correct' ? `
                                            <span class="text-green-600 flex items-center gap-2"><i data-lucide="check"></i> صحیح!</span>
                                        ` : `
                                            <span class="text-red-600 flex items-center gap-2"><i data-lucide="x"></i> اشتباه!</span>
                                        `}
                                    </div>
                                    <p class="text-slate-700 text-sm">${currentItem.explanation}</p>
                                    <div class="mt-4 text-xs text-slate-400">سوال بعدی در حال بارگذاری...</div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuizTab(session) {
            const questions = session.quiz;
            const { userAnswers, submitted } = state.quiz;
            const isCompleted = state.completedSessions.includes(session.id);

            if (!questions || questions.length === 0) {
                return `
                    <div class="text-center p-8 text-slate-500 bg-slate-50 rounded-lg animate-fade-in">
                        آزمونی برای این جلسه تعریف نشده است.
                    </div>
                `;
            }

            const questionsHtml = questions.map((q, qIdx) => {
                const optionsHtml = q.options.map((opt, oIdx) => {
                    let btnClass = "w-full text-right p-4 rounded-lg border-2 transition-all flex items-center justify-between ";
                    let iconHtml = '';

                    if (submitted) {
                        if (oIdx === q.correctIndex) {
                            btnClass += "bg-green-100 border-green-500 text-green-900";
                            iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600"></i>`;
                        } else if (userAnswers[qIdx] === oIdx && oIdx !== q.correctIndex) {
                            btnClass += "bg-red-50 border-red-300 text-red-900";
                            iconHtml = `<i data-lucide="alert-circle" class="w-5 h-5 text-red-600"></i>`;
                        } else {
                            btnClass += "bg-slate-50 border-transparent text-slate-400 opacity-50";
                        }
                    } else {
                        if (userAnswers[qIdx] === oIdx) {
                            btnClass += "bg-health-50 border-health-500 text-health-900";
                        } else {
                            btnClass += "bg-white border-slate-200 hover:bg-slate-50 text-slate-700";
                        }
                    }

                    return `
                        <button
                            onclick="app.handleQuizSelect(${qIdx}, ${oIdx})"
                            class="${btnClass}"
                            ${submitted ? 'disabled' : ''}
                        >
                            <span>${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white border rounded-xl p-6 shadow-sm">
                        <h4 class="font-bold text-lg mb-4 flex gap-2">
                            <span class="text-health-500">${qIdx + 1}.</span> ${q.text}
                        </h4>
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>
                        ${submitted ? `
                            <div class="mt-4 p-4 bg-blue-50 text-blue-800 rounded-lg text-sm leading-6">
                                <strong>توضیح:</strong> ${q.explanation}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-8 max-w-3xl mx-auto animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-bold text-health-900">آزمون ارزشیابی</h3>
                        ${!submitted ? `
                            <span class="text-sm text-slate-500">${userAnswers.filter(a => a !== -1).length} از ${questions.length} پاسخ داده شده</span>
                        ` : ''}
                    </div>

                    ${questionsHtml}

                    <div class="flex justify-end pt-4">
                        ${!submitted ? `
                            <button 
                                onclick="app.submitQuiz()"
                                class="px-8 py-3 bg-health-700 text-white font-bold rounded-lg shadow hover:bg-health-800 transition-colors flex items-center gap-2"
                            >
                                ثبت پاسخ‌ها
                            </button>
                        ` : `
                            <button 
                                onclick="app.resetQuiz()"
                                class="px-8 py-3 bg-slate-600 text-white font-bold rounded-lg shadow hover:bg-slate-700 transition-colors flex items-center gap-2"
                            >
                                <i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i>
                                آزمون مجدد
                            </button>
                        `}
                    </div>

                    ${isCompleted ? `
                        <div class="mt-8 bg-green-50 border border-green-200 rounded-xl p-6 text-center animate-fade-in-up">
                            <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 rounded-full text-green-600 mb-3">
                                <i data-lucide="check-square" class="w-6 h-6"></i>
                            </div>
                            <h4 class="text-green-800 font-bold text-lg mb-1">جلسه تکمیل شد!</h4>
                            <p class="text-green-700 text-sm">شما این جلسه را با موفقیت گذراندید.</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderSessionSummaryCard(session) {
            // Extract key takeaways from content (simplified for this example)
            // In a real app, this might be a separate field in the session object
            const summaryMatch = session.content.match(/<strong class="text-health-900 block mb-2 text-lg">خلاصه (جلسه|مدیریتی)<\/strong>\s*<p.*?>(.*?)<\/p>/s);
            const summaryText = summaryMatch ? summaryMatch[1] : session.description;

            return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300 flex flex-col h-full">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-health-50 flex items-center justify-center text-health-600 font-bold text-sm">
                            ${session.id}
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg line-clamp-1" title="${session.title}">${session.title}</h3>
                    </div>
                    <p class="text-slate-600 text-sm leading-relaxed flex-grow mb-4 line-clamp-4">
                        ${summaryText.replace(/<[^>]*>/g, '')}
                    </p>
                    <button 
                        onclick="app.selectSession(${session.id})"
                        class="text-health-600 text-sm font-medium hover:text-health-700 flex items-center gap-1 mt-auto self-end"
                    >
                        مشاهده کامل
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
        }

        function renderContact() {
            return `
                <div class="bg-slate-900 text-white p-12 text-center mt-12">
                    <h2 class="text-3xl font-bold mb-4">ارتباط با ما</h2>
                    <p class="text-slate-400 mb-8">برای همکاری‌های علمی و پژوهشی</p>
                    <div class="flex justify-center gap-6">
                        <a href="mailto:healcono@gmail.com" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300">
                            <i data-lucide="mail"></i> healcono@gmail.com
                        </a>
                        <a href="#" class="flex items-center gap-2 text-emerald-400 hover:text-emerald-300">
                            <i data-lucide="instagram"></i> @healthcono
                        </a>
                    </div>
                </div>
            `;
        }

        // Start App
        init();

    </script>
</body>
</html>
