
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سواد رسانه‌ای در سلامت | دکتر فاطمه زارعی</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        nude: {
                            50: '#fdfbf7', 100: '#f7f2ea', 200: '#eee4d5', 300: '#e0d1bc',
                            400: '#ccb59a', 500: '#b89a7a', 600: '#a38161', 700: '#89684f',
                            800: '#715543', 900: '#5c4639', 950: '#32251e',
                        }
                    },
                    animation: {
                        'slow-zoom': 'slowZoom 20s infinite alternate',
                        'fade': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slowZoom: {
                            '0%': { transform: 'scale(1)' },
                            '100%': { transform: 'scale(1.15)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fdfbf7; color: #32251e; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #eee4d5; border-radius: 10px; }
        
        .aparat-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 2.5rem; background: #1a1a1a; margin-bottom: 4rem; shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .aparat-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .active-session { background-color: #f7f2ea; border-right: 4px solid #a38161; color: #5c4639 !important; }
        .hidden { display: none; }
        
        .raw-content-area h3 { color: #32251e; font-weight: 900; font-size: 2.25rem; letter-spacing: -0.05em; line-height: 1.2; margin-bottom: 1rem; }
        .raw-content-area p { line-height: 2.2; margin-bottom: 1.5rem; text-align: justify; font-size: 1.125rem; color: #475569; }
        
        button:disabled { cursor: not-allowed; opacity: 0.6; }
    </style>
    
    <script type="importmap">
{
  "imports": {
    "lucide": "https://esm.sh/lucide@^0.564.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="overflow-hidden">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-80 bg-white border-l border-nude-200 shadow-2xl transform translate-x-full transition-transform duration-700 lg:relative lg:translate-x-0 flex flex-col">
            <div class="p-8 border-b border-nude-100 h-24 flex items-center justify-between">
                <h1 class="font-black text-nude-950 flex items-center gap-3 text-lg tracking-tighter">
                    <div class="p-2 bg-nude-900 rounded-xl text-white">
                        <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                    </div>
                    سواد سلامت
                </h1>
                <button onclick="toggleSidebar()" class="lg:hidden p-2 text-nude-400"><i data-lucide="x"></i></button>
            </div>
            
            <div id="session-list" class="flex-1 overflow-y-auto custom-scrollbar py-6"></div>

            <div class="p-8 border-t border-nude-100 bg-nude-50/50">
                <div class="text-[10px] text-nude-600 space-y-2">
                    <p class="font-black text-nude-900 mb-3 tracking-widest uppercase opacity-40">Academic Contact</p>
                    <p class="flex items-center gap-2 hover:text-nude-900 transition-colors"><i data-lucide="mail" class="w-3 h-3"></i> healcono@gmail.com</p>
                    <p class="flex items-center gap-2 hover:text-nude-900 transition-colors"><i data-lucide="instagram" class="w-3 h-3"></i> @healthcono</p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 bg-white overflow-y-auto relative custom-scrollbar">
            <header class="lg:hidden h-20 bg-white/90 backdrop-blur-xl border-b border-nude-100 px-8 flex items-center justify-between sticky top-0 z-40">
                <button onclick="toggleSidebar()" class="p-3 bg-nude-50 rounded-2xl text-nude-900"><i data-lucide="menu"></i></button>
                <span class="font-black text-nude-950 text-sm tracking-tighter">MEDIA HEALTH LITERACY</span>
                <div class="w-10"></div>
            </header>

            <div class="w-full">
                <!-- Top Progress Stats -->
                <div class="max-w-5xl mx-auto px-8 md:px-16 pt-12 flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-[10px] font-black text-nude-300 uppercase tracking-widest mb-1">Interactive University Course</h2>
                        <div id="session-counter" class="text-3xl font-black text-nude-950 tracking-tighter">جلسه اول</div>
                    </div>
                    <div class="text-left">
                        <div id="progress-text" class="text-[9px] font-black text-nude-400 mb-2 uppercase tracking-[0.2em]">PROGRESS: 0%</div>
                        <div class="w-40 h-1.5 bg-nude-100 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-nude-950 transition-all duration-1000 w-0 shadow-lg shadow-nude-200"></div>
                        </div>
                    </div>
                </div>

                <!-- MAIN DISPLAY AREA / SESSION CONTENT -->
                <div id="session-content" class="bg-white min-h-screen pb-20">
                    <!-- Dynamic Content Injected Here by main.js -->
                </div>
            </div>
        </main>
    </div>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-nude-950/40 backdrop-blur-md z-40 hidden lg:hidden"></div>

    <!-- Script loaded as module -->
    <script type="module" src="main.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
